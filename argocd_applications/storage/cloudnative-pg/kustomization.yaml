apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NOTE: No namespace transformer — the upstream cnpg manifest manages its own
# namespace (cnpg-system). Overriding breaks webhook configuration.
resources:
  # CloudNativePG v1.28.1 — update version here when upgrading
  - https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.28.1/cnpg-1.28.1.yaml

patches:
  - path: operator-monitoring-patch.yaml
