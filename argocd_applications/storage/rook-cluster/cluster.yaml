apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v19.2.3
    allowUnsupported: false
  dataDirHostPath: /var/lib/rook
  skipUpgradeChecks: true  # Required for size=1 pools — ok-to-stop always fails
  continueUpgradeAfterChecksEvenIfNotHealthy: true
  
  mon:
    count: 3  # Quorum requires odd number; 2 workers + allowMultiplePerNode
    allowMultiplePerNode: true  # Needed with only 2 worker nodes
  
  mgr:
    count: 2  # Active + standby for failover
    allowMultiplePerNode: true  # Needed with only 2 worker nodes
    modules:
      - name: pg_autoscaler
        enabled: true
  
  dashboard:
    enabled: true
    ssl: false
  
  monitoring:
    enabled: false
  
  network:
    connections:
      encryption:
        enabled: false
      compression:
        enabled: false
  
  crashCollector:
    disable: false
  
  logCollector:
    enabled: true
    periodicity: 24h
  
  cleanupPolicy:
    confirmation: ""
    sanitizeDisks:
      method: quick
      dataSource: zero
      iteration: 1
    allowUninstallWithVolumes: false
  
  # Automatic device discovery - placement affinity restricts to role=infra nodes
  storage:
    useAllNodes: true
    useAllDevices: false
    deviceFilter: "^sd[b-z]"  # Auto-discover sdb, sdc, sdd, etc. (excludes sda OS disk)
    config:
      osdsPerDevice: "1"  # Single OSD per device for testing
  
  resources:
    mon:
      requests:
        cpu: "10m"
        memory: "512Mi"
      limits:
        memory: "1Gi"
    mgr:
      requests:
        cpu: "10m"
        memory: "512Mi"
      limits:
        memory: "1Gi"
    osd:
      requests:
        cpu: "10m"
        memory: "2Gi"
      limits:
        memory: "4Gi"
    prepareosd:
      requests:
        cpu: "10m"
        memory: "50Mi"
  
  priorityClassNames:
    mon: system-node-critical
    osd: system-node-critical
    mgr: system-cluster-critical
  
  # Placement: ensure Rook pods only run on infra-role nodes
  placement:
    all:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist
            - key: role
              operator: In
              values:
              - infra
      tolerations:
      - key: role
        operator: Equal
        value: infra
        effect: NoSchedule
      - effect: NoSchedule
        key: node.kubernetes.io/not-ready
        operator: Exists
      - effect: NoSchedule
        key: node.kubernetes.io/unreachable
        operator: Exists
  
  disruptionManagement:
    managePodBudgets: true
    osdMaintenanceTimeout: 30
    pgHealthCheckTimeout: 60
