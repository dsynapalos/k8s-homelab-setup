apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v19.2.3
    allowUnsupported: false
  dataDirHostPath: /var/lib/rook
  skipUpgradeChecks: false
  continueUpgradeAfterChecksEvenIfNotHealthy: false
  
  mon:
    count: 3  # Quorum requires odd number; 2 workers + allowMultiplePerNode
    allowMultiplePerNode: true  # Needed with only 2 worker nodes
  
  mgr:
    count: 2  # Active + standby for failover
    allowMultiplePerNode: true  # Needed with only 2 worker nodes
    modules:
      - name: pg_autoscaler
        enabled: true
  
  dashboard:
    enabled: true
    ssl: false
  
  monitoring:
    enabled: false
  
  network:
    connections:
      encryption:
        enabled: false
      compression:
        enabled: false
  
  crashCollector:
    disable: false
  
  logCollector:
    enabled: true
    periodicity: 24h
  
  cleanupPolicy:
    confirmation: ""
    sanitizeDisks:
      method: quick
      dataSource: zero
      iteration: 1
    allowUninstallWithVolumes: false
  
  # Automatic device discovery - uses all available raw devices on worker nodes only
  # Placement (below) restricts Rook pods to non-control-plane nodes.
  # Only worker VMs receive secondary disks during provisioning, so
  # useAllNodes + deviceFilter safely discovers only the intended devices.
  storage:
    useAllNodes: true
    useAllDevices: false
    deviceFilter: "^sd[b-z]"  # Auto-discover sdb, sdc, sdd, etc. (excludes sda OS disk)
    config:
      osdsPerDevice: "1"  # Single OSD per device for testing
  
  resources:
    mon:
      requests:
        cpu: "10m"
        memory: "512Mi"
      limits:
        memory: "1Gi"
    mgr:
      requests:
        cpu: "10m"
        memory: "512Mi"
      limits:
        memory: "1Gi"
    osd:
      requests:
        cpu: "10m"
        memory: "2Gi"
      limits:
        memory: "4Gi"
    prepareosd:
      requests:
        cpu: "10m"
        memory: "50Mi"
  
  priorityClassNames:
    mon: system-node-critical
    osd: system-node-critical
    mgr: system-cluster-critical
  
  # Placement: ensure Rook pods only run on worker nodes, NOT control plane
  placement:
    all:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist
      tolerations:
      - effect: NoSchedule
        key: node.kubernetes.io/not-ready
        operator: Exists
      - effect: NoSchedule
        key: node.kubernetes.io/unreachable
        operator: Exists
  
  disruptionManagement:
    managePodBudgets: true
    osdMaintenanceTimeout: 30
    pgHealthCheckTimeout: 60
