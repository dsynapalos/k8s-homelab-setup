apiVersion: v1
kind: ConfigMap
metadata:
  name: rook-ceph-operator-config
  namespace: rook-ceph
data:
  # Single replica for CSI provisioners in single-node cluster
  CSI_PROVISIONER_REPLICAS: "1"
  CSI_ENABLE_CEPHFS_SNAPSHOTTER: "true"
  CSI_ENABLE_RBD_SNAPSHOTTER: "true"
  # Enable discovery daemon to auto-detect drives on k8s-node-1
  ROOK_ENABLE_DISCOVERY_DAEMON: "true"
  # Disable host networking for single-node test cluster
  ROOK_CSI_ENABLE_HOST_NETWORK: "false"
