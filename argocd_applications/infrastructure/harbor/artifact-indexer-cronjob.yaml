apiVersion: batch/v1
kind: CronJob
metadata:
  name: harbor-artifact-indexer
  namespace: harbor
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: harbor-bootstrap
          restartPolicy: OnFailure
          containers:
          - name: indexer
            image: docker.io/library/alpine:3.21
            command:
            - /bin/sh
            - -c
            - |
              set -e
              apk add --no-cache curl jq wget ca-certificates > /dev/null 2>&1

              # Install Cosign for signature operations
              COSIGN_VERSION="v2.4.1"
              wget -q "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" \
                -O /usr/local/bin/cosign && chmod +x /usr/local/bin/cosign

              # Install crane for image copy operations
              CRANE_VERSION="v0.20.2"
              wget -q "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
                -O /tmp/crane.tar.gz && tar -xzf /tmp/crane.tar.gz -C /usr/local/bin crane && rm /tmp/crane.tar.gz

              # Trust homelab CA for Harbor TLS
              cp /etc/ssl/certs/homelab/*.crt /usr/local/share/ca-certificates/ 2>/dev/null || true
              update-ca-certificates > /dev/null 2>&1

              HARBOR_API="https://harbor.k8s.local/api/v2.0"
              HARBOR_V2="https://harbor.k8s.local/v2"
              AUTH="admin:$HARBOR_ADMIN_PASSWORD"
              KUBE_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              KUBE_API="https://kubernetes.default.svc"
              KUBE_CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

              echo "=== Harbor Artifact Indexer $(date -Iseconds) ==="

              # ── Discover images from cluster pods ──────────────────────
              echo "Discovering images from cluster pods..."
              ALL_POD_IMAGES=$(curl -s --cacert "$KUBE_CA" \
                -H "Authorization: Bearer $KUBE_TOKEN" \
                "$KUBE_API/api/v1/pods" | jq -r '
                [.items[].spec |
                 ((.initContainers // [])[], .containers[]) | .image
                ] | unique[]' 2>/dev/null || true)

              POD_IMAGES=$(echo "$ALL_POD_IMAGES" | grep "^harbor.k8s.local/" || true)
              EXTERNAL_IMAGES=$(echo "$ALL_POD_IMAGES" | grep -v "^harbor.k8s.local/" || true)
              HARBOR_COUNT=$(echo "$POD_IMAGES" | grep -c . 2>/dev/null || echo 0)
              EXTERNAL_COUNT=$(echo "$EXTERNAL_IMAGES" | grep -c . 2>/dev/null || echo 0)
              echo "Found $HARBOR_COUNT Harbor-proxied + $EXTERNAL_COUNT external images."

              # Normalize external image references to canonical form
              normalize_image() {
                local IMG="$1"
                # Strip @sha256: digest pin (keep tag before it)
                IMG="${IMG%%@sha256:*}"
                # Normalize implicit Docker Hub references
                case "$IMG" in
                  *.*/*) ;;                       # Has registry (dot before slash)
                  */*) IMG="docker.io/$IMG" ;;    # Docker Hub with namespace
                  *)   IMG="docker.io/library/$IMG" ;; # Bare image
                esac
                echo "$IMG"
              }

              # ── Index repos with 0 artifacts ───────────────────────────
              # Harbor bug #21454: multi-arch images don't register artifact
              # metadata. Workaround: request the manifest list, extract the
              # amd64 platform digest, then request that specific manifest.
              INDEXED=0

              index_image() {
                local PROJECT="$1" REPO="$2" REF="$3"
                local REPO_ENCODED
                REPO_ENCODED=$(echo "$REPO" | sed 's|/|%2F|g')

                local ARTIFACT_COUNT
                ARTIFACT_COUNT=$(curl -sk -u "$AUTH" \
                  "$HARBOR_API/projects/$PROJECT/repositories/$REPO_ENCODED" 2>/dev/null | \
                  jq -r '.artifact_count // 0')

                if [ "$ARTIFACT_COUNT" != "0" ] && [ "$ARTIFACT_COUNT" != "null" ]; then
                  return 0
                fi

                echo "  Indexing: $PROJECT/$REPO ($REF)..."

                # Step 1: request manifest — check if it's a manifest list
                local MANIFEST
                MANIFEST=$(curl -sk -u "$AUTH" \
                  -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json" \
                  "$HARBOR_V2/$PROJECT/$REPO/manifests/$REF" 2>/dev/null)

                local MEDIA_TYPE
                MEDIA_TYPE=$(echo "$MANIFEST" | jq -r '.mediaType // empty')

                case "$MEDIA_TYPE" in
                  *manifest.list*|*image.index*)
                    # Multi-arch: extract amd64/linux digest, request it directly
                    local PLAT_DIGEST
                    PLAT_DIGEST=$(echo "$MANIFEST" | jq -r '
                      .manifests[] |
                      select(.platform.architecture=="amd64" and .platform.os=="linux") |
                      .digest' | head -1)
                    if [ -n "$PLAT_DIGEST" ]; then
                      curl -sk -o /dev/null -u "$AUTH" \
                        -H "Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json" \
                        "$HARBOR_V2/$PROJECT/$REPO/manifests/$PLAT_DIGEST" 2>/dev/null
                      INDEXED=$((INDEXED + 1))
                    else
                      echo "    WARNING: no amd64/linux platform in manifest list"
                    fi
                    ;;
                  *)
                    # Single-arch: the initial request already triggered indexing
                    INDEXED=$((INDEXED + 1))
                    ;;
                esac
              }

              for IMAGE in $POD_IMAGES; do
                IMAGE_PATH="${IMAGE#harbor.k8s.local/}"
                PROJECT="${IMAGE_PATH%%/*}"
                REMAINDER="${IMAGE_PATH#*/}"

                case "$REMAINDER" in
                  *@sha256:*) REPO="${REMAINDER%%@*}"; REF="${REMAINDER##*@}" ;;
                  *:*)        REPO="${REMAINDER%:*}";  REF="${REMAINDER##*:}" ;;
                  *)          REPO="$REMAINDER";       REF="latest" ;;
                esac

                index_image "$PROJECT" "$REPO" "$REF"
              done

              # ── Also check Harbor repos not discovered via pods ────────
              echo "Checking Harbor repos not in pod list..."
              PROXY_PROJECTS=$(curl -sk -u "$AUTH" \
                "$HARBOR_API/projects?page_size=100" | \
                jq -r '.[] | select(.registry_id > 0) | .name' 2>/dev/null || true)

              for PROJECT in $PROXY_PROJECTS; do
                UNINDEXED_REPOS=$(curl -sk -u "$AUTH" \
                  "$HARBOR_API/projects/$PROJECT/repositories?page_size=100" 2>/dev/null | \
                  jq -r '.[] | select(.artifact_count == 0 and .pull_count > 0) | .name' 2>/dev/null || true)

                for REPO_FULL in $UNINDEXED_REPOS; do
                  [ -z "$REPO_FULL" ] && continue
                  REPO="${REPO_FULL#*/}"

                  # Skip if already handled via pod discovery
                  echo "$POD_IMAGES" | grep -q "$PROJECT/$REPO" 2>/dev/null && continue

                  REPO_ENCODED=$(echo "$REPO" | sed 's|/|%2F|g')
                  FIRST_TAG=$(curl -sk -u "$AUTH" \
                    "$HARBOR_V2/$PROJECT/$REPO/tags/list" 2>/dev/null | \
                    jq -r '.tags[0] // empty')

                  if [ -n "$FIRST_TAG" ]; then
                    index_image "$PROJECT" "$REPO" "$FIRST_TAG"
                  fi
                done
              done

              if [ "$INDEXED" -gt 0 ]; then
                echo "Waiting 30s for async artifact registration..."
                sleep 30
              fi

              # ── Clean up ghost artifacts ────────────────────────────
              # Proxy cache operations can create ghost artifacts (empty
              # architecture, no tags). Delete them to keep repos clean.
              echo "Cleaning up ghost artifacts..."
              CLEANED=0

              for PROJECT in $PROXY_PROJECTS; do
                GC_REPOS=$(curl -sk -u "$AUTH" \
                  "$HARBOR_API/projects/$PROJECT/repositories?page_size=100" 2>/dev/null | \
                  jq -r '.[] | select(.artifact_count > 0) | .name' 2>/dev/null || true)

                for REPO_FULL in $GC_REPOS; do
                  [ -z "$REPO_FULL" ] && continue
                  REPO="${REPO_FULL#*/}"
                  REPO_ENCODED=$(echo "$REPO" | sed 's|/|%2F|g')

                  GHOST_DIGESTS=$(curl -sk -u "$AUTH" \
                    "$HARBOR_API/projects/$PROJECT/repositories/$REPO_ENCODED/artifacts?page_size=50&with_tag=true" 2>/dev/null | \
                    jq -r '.[] | select(
                      (.extra_attrs.architecture == "" or .extra_attrs.architecture == null) and
                      ((.tags // []) | length == 0)
                    ) | .digest' 2>/dev/null || true)

                  for GHOST in $GHOST_DIGESTS; do
                    [ -z "$GHOST" ] && continue
                    echo "  Deleting ghost: $PROJECT/$REPO @${GHOST:0:20}"
                    curl -sk -o /dev/null -u "$AUTH" \
                      -X DELETE "$HARBOR_API/projects/$PROJECT/repositories/$REPO_ENCODED/artifacts/$GHOST" 2>/dev/null || true
                    CLEANED=$((CLEANED + 1))
                  done
                done
              done

              # Re-index repos that became empty after ghost cleanup
              if [ "$CLEANED" -gt 0 ]; then
                echo "Re-indexing repos emptied by ghost cleanup..."
                for IMAGE in $POD_IMAGES; do
                  IMAGE_PATH="${IMAGE#harbor.k8s.local/}"
                  PROJECT="${IMAGE_PATH%%/*}"
                  REMAINDER="${IMAGE_PATH#*/}"

                  case "$REMAINDER" in
                    *@sha256:*) REPO="${REMAINDER%%@*}"; REF="${REMAINDER##*@}" ;;
                    *:*)        REPO="${REMAINDER%:*}";  REF="${REMAINDER##*:}" ;;
                    *)          REPO="$REMAINDER";       REF="latest" ;;
                  esac

                  index_image "$PROJECT" "$REPO" "$REF"
                done

                if [ "$INDEXED" -gt 0 ]; then
                  echo "Waiting 30s for async artifact registration..."
                  sleep 30
                fi
              fi

              # ── Import external images into cluster-images ─────────────
              # Images not pulled through Harbor proxy cache are copied into
              # a local writable project for scanning, SBOM, and signing.
              echo "Importing external cluster images..."
              IMPORTED=0

              # Create cluster-images project (idempotent — 409 = already exists)
              curl -sk -o /dev/null -u "$AUTH" \
                -X POST "$HARBOR_API/projects" \
                -H "Content-Type: application/json" \
                -d '{"project_name":"cluster-images","metadata":{"public":"false","auto_scan":"true"},"storage_limit":-1}' 2>/dev/null || true

              # Enable auto-scan if project already existed (PUT is idempotent)
              curl -sk -o /dev/null -u "$AUTH" \
                -X PUT "$HARBOR_API/projects/cluster-images/metadatas/auto_scan" \
                -H "Content-Type: application/json" \
                -d '{"auto_scan": "true"}' 2>/dev/null || true

              # Register scan webhook on cluster-images (idempotent)
              CI_WEBHOOK_NAME="matrix-vulnerability-report"
              CI_WEBHOOK_EXISTS=$(curl -sk -u "$AUTH" \
                "$HARBOR_API/projects/cluster-images/webhook/policies" 2>/dev/null | \
                jq -r --arg name "$CI_WEBHOOK_NAME" '.[] | select(.name == $name) | .id' 2>/dev/null || true)
              if [ -z "$CI_WEBHOOK_EXISTS" ] || [ "$CI_WEBHOOK_EXISTS" = "null" ]; then
                echo "  Registering scan webhook on cluster-images..."
                curl -sk -o /dev/null -u "$AUTH" \
                  -X POST "$HARBOR_API/projects/cluster-images/webhook/policies" \
                  -H "Content-Type: application/json" \
                  -d "$(jq -n --arg name "$CI_WEBHOOK_NAME" \
                    --arg url "http://matrix-bridge.monitoring.svc.cluster.local:3001" \
                    '{name: $name, enabled: true, targets: [{type: "http", address: $url, skip_cert_verify: false}], event_types: ["SCANNING_COMPLETED"]}')" 2>/dev/null || true
              fi

              # Authenticate crane to Harbor
              crane auth login harbor.k8s.local -u admin -p "$HARBOR_ADMIN_PASSWORD" 2>/dev/null

              for RAW_IMAGE in $EXTERNAL_IMAGES; do
                NORM=$(normalize_image "$RAW_IMAGE")
                # Parse tag and repo path
                case "$NORM" in
                  *:*) IMG_TAG="${NORM##*:}"; REPO_PATH="${NORM%:*}" ;;
                  *)   IMG_TAG="latest";      REPO_PATH="$NORM" ;;
                esac
                REPO_ENCODED=$(echo "$REPO_PATH" | sed 's|/|%2F|g')

                # Skip if this tag already exists in cluster-images
                EXISTING_TAGS=$(curl -sk -u "$AUTH" \
                  "$HARBOR_API/projects/cluster-images/repositories/$REPO_ENCODED/artifacts?with_tag=true&page_size=50" 2>/dev/null | \
                  jq -r '[.[].tags // [] | .[].name] | join(",")' 2>/dev/null || true)
                case ",$EXISTING_TAGS," in
                  *,"$IMG_TAG",*) continue ;;
                esac

                echo "  Importing: $NORM"
                if crane copy --platform linux/amd64 "$NORM" "harbor.k8s.local/cluster-images/$REPO_PATH:$IMG_TAG" 2>/dev/null; then
                  IMPORTED=$((IMPORTED + 1))
                else
                  echo "    WARNING: failed to import $NORM"
                fi
              done

              if [ "$IMPORTED" -gt 0 ]; then
                echo "Waiting 15s for artifact registration..."
                sleep 15
              fi

              # ── SBOM + vulnerability scan for all artifacts ────────────
              echo "Checking SBOM and scan status..."
              SBOM_COUNT=0
              SCAN_COUNT=0
              SCAN_PROJECTS="$PROXY_PROJECTS cluster-images"

              for PROJECT in $SCAN_PROJECTS; do
                INDEXED_REPOS=$(curl -sk -u "$AUTH" \
                  "$HARBOR_API/projects/$PROJECT/repositories?page_size=100" 2>/dev/null | \
                  jq -r '.[] | select(.artifact_count > 0) | .name' 2>/dev/null || true)

                for REPO_FULL in $INDEXED_REPOS; do
                  [ -z "$REPO_FULL" ] && continue
                  REPO="${REPO_FULL#*/}"
                  REPO_ENCODED=$(echo "$REPO" | sed 's|/|%2F|g')

                  ARTIFACTS=$(curl -sk -u "$AUTH" \
                    "$HARBOR_API/projects/$PROJECT/repositories/$REPO_ENCODED/artifacts?page=1&page_size=10&with_scan_overview=true&with_accessory=true" 2>/dev/null)

                  DIGESTS=$(echo "$ARTIFACTS" | jq -r '.[].digest // empty' 2>/dev/null || true)

                  for DIGEST in $DIGESTS; do
                    [ -z "$DIGEST" ] && continue

                    SCAN_STATUS=$(echo "$ARTIFACTS" | jq -r \
                      --arg d "$DIGEST" \
                      '.[] | select(.digest == $d) |
                       .scan_overview // {} | to_entries[0].value.scan_status // empty')

                    HAS_SBOM=$(echo "$ARTIFACTS" | jq -r \
                      --arg d "$DIGEST" \
                      '[.[] | select(.digest == $d) | .accessories // [] | .[] |
                       select((.type // "") | test("sbom"; "i"))] | length')

                    # Trigger vulnerability scan if not yet scanned
                    if [ -z "$SCAN_STATUS" ] || [ "$SCAN_STATUS" = "null" ]; then
                      echo "  Scan: $PROJECT/$REPO"
                      curl -sk -o /dev/null -u "$AUTH" \
                        -X POST "$HARBOR_API/projects/$PROJECT/repositories/$REPO_ENCODED/artifacts/$DIGEST/scan" \
                        -H "Content-Type: application/json" 2>/dev/null || true
                      SCAN_COUNT=$((SCAN_COUNT + 1))
                    fi

                    # Trigger SBOM generation if missing
                    if [ "$HAS_SBOM" = "0" ] || [ "$HAS_SBOM" = "null" ]; then
                      echo "  SBOM: $PROJECT/$REPO"
                      curl -sk -o /dev/null -u "$AUTH" \
                        -X POST "$HARBOR_API/projects/$PROJECT/repositories/$REPO_ENCODED/artifacts/$DIGEST/scan" \
                        -H "Content-Type: application/json" \
                        -d '{"scan_type":"sbom"}' 2>/dev/null || true
                      SBOM_COUNT=$((SBOM_COUNT + 1))
                    fi
                  done
                done
              done

              # ── Signature verification and signing ────────────────────
              echo "Verifying and signing artifacts..."
              VERIFY_OK=0
              VERIFY_FAIL=0
              SIGN_COUNT=0

              # Ensure Cosign keypair exists (created once, reused thereafter)
              if ! curl -s --cacert "$KUBE_CA" -H "Authorization: Bearer $KUBE_TOKEN" \
                  "$KUBE_API/api/v1/namespaces/harbor/secrets/cosign-keypair" 2>/dev/null | \
                  jq -e '.data["cosign.key"]' > /dev/null 2>&1; then
                echo "  Generating Cosign keypair..."
                COSIGN_PASSWORD="" cosign generate-key-pair k8s://harbor/cosign-keypair 2>/dev/null
                echo "  Keypair created."
              else
                echo "  Cosign keypair exists."
              fi

              # Login to Harbor registry for pushing signatures
              cosign login harbor.k8s.local -u admin -p "$HARBOR_ADMIN_PASSWORD" 2>/dev/null

              # Map proxy cache project to upstream registry
              upstream_registry() {
                case "$1" in
                  dockerhub-cache)     echo "docker.io" ;;
                  quay-cache)          echo "quay.io" ;;
                  k8s-registry-cache)  echo "registry.k8s.io" ;;
                  nvcr-cache)          echo "nvcr.io" ;;
                  *)                   echo "" ;;
                esac
              }

              # Create verification labels (idempotent — 409 = already exists)
              for LBL_NAME in upstream-verified upstream-unverified; do
                case "$LBL_NAME" in
                  upstream-verified)   LBL_COLOR="#2E8B57" LBL_DESC="Upstream Sigstore signature verified" ;;
                  upstream-unverified) LBL_COLOR="#CD5C5C" LBL_DESC="No verifiable upstream signature found" ;;
                esac
                curl -sk -o /dev/null -w '' -u "$AUTH" \
                  -X POST "$HARBOR_API/labels" \
                  -H "Content-Type: application/json" \
                  -d "{\"name\":\"$LBL_NAME\",\"description\":\"$LBL_DESC\",\"color\":\"$LBL_COLOR\",\"scope\":\"g\"}" 2>/dev/null || true
              done

              # Fetch label IDs for later use
              ALL_LABELS=$(curl -sk -u "$AUTH" "$HARBOR_API/labels?scope=g&page_size=100" 2>/dev/null)
              LABEL_VERIFIED_ID=$(echo "$ALL_LABELS" | jq -r '.[] | select(.name=="upstream-verified") | .id')
              LABEL_UNVERIFIED_ID=$(echo "$ALL_LABELS" | jq -r '.[] | select(.name=="upstream-unverified") | .id')

              # ── Proxy cache: verify upstream signatures ────────────────
              # Note: Harbor proxy cache projects are read-only (no push),
              # so we cannot co-sign with a homelab key. Instead we verify
              # upstream Sigstore signatures and record the result as a
              # Harbor label on each artifact.
              for IMAGE in $POD_IMAGES; do
                IMAGE_PATH="${IMAGE#harbor.k8s.local/}"
                PROJECT="${IMAGE_PATH%%/*}"
                REMAINDER="${IMAGE_PATH#*/}"

                case "$REMAINDER" in
                  *@sha256:*) REPO="${REMAINDER%%@*}"; SIG_TAG="${REMAINDER##*@}" ;;
                  *:*)        REPO="${REMAINDER%:*}";  SIG_TAG="${REMAINDER##*:}" ;;
                  *)          REPO="$REMAINDER";       SIG_TAG="latest" ;;
                esac

                UPSTREAM=$(upstream_registry "$PROJECT")
                [ -z "$UPSTREAM" ] && continue

                REPO_ENCODED=$(echo "$REPO" | sed 's|/|%2F|g')
                ART_DATA=$(curl -sk -u "$AUTH" \
                  "$HARBOR_API/projects/$PROJECT/repositories/$REPO_ENCODED/artifacts?with_label=true&page_size=10" 2>/dev/null)
                # Target the real artifact (amd64), not ghost artifacts
                SIG_DIGEST=$(echo "$ART_DATA" | jq -r '
                  ([.[] | select(.extra_attrs.architecture == "amd64")] | .[0].digest) //
                  (.[0].digest) //
                  empty')
                [ -z "$SIG_DIGEST" ] && continue

                # Skip if already labelled (verified or unverified)
                EXISTING_LABELS=$(echo "$ART_DATA" | jq -r --arg d "$SIG_DIGEST" \
                  '[.[] | select(.digest == $d) | .labels // [] | .[].name] | join(",")' 2>/dev/null)
                case "$EXISTING_LABELS" in
                  *upstream-verified*|*upstream-unverified*) continue ;;
                esac

                # Verify upstream signature (keyless via Sigstore/Rekor)
                UPSTREAM_REF="$UPSTREAM/$REPO:$SIG_TAG"
                if cosign verify \
                    --certificate-identity-regexp='.*' \
                    --certificate-oidc-issuer-regexp='.*' \
                    "$UPSTREAM_REF" > /dev/null 2>&1; then
                  echo "  upstream-verified: $UPSTREAM_REF"
                  VERIFY_OK=$((VERIFY_OK + 1))
                  APPLY_LABEL_ID="$LABEL_VERIFIED_ID"
                else
                  echo "  upstream-unverified: $UPSTREAM_REF"
                  VERIFY_FAIL=$((VERIFY_FAIL + 1))
                  APPLY_LABEL_ID="$LABEL_UNVERIFIED_ID"
                fi

                # Apply verification label to artifact
                if [ -n "$APPLY_LABEL_ID" ]; then
                  curl -sk -o /dev/null -u "$AUTH" \
                    -X POST "$HARBOR_API/projects/$PROJECT/repositories/$REPO_ENCODED/artifacts/$SIG_DIGEST/labels" \
                    -H "Content-Type: application/json" \
                    -d "{\"id\":$APPLY_LABEL_ID}" 2>/dev/null || true
                fi
              done

              # ── cluster-images: verify upstream signatures ─────────────
              # These are writable copies imported from external registries.
              # Verify upstream Sigstore signatures and apply labels.
              CI_REPOS=$(curl -sk -u "$AUTH" \
                "$HARBOR_API/projects/cluster-images/repositories?page_size=200" 2>/dev/null | \
                jq -r '.[].name' 2>/dev/null || true)

              for CI_REPO_FULL in $CI_REPOS; do
                [ -z "$CI_REPO_FULL" ] && continue
                CI_REPO="${CI_REPO_FULL#cluster-images/}"
                CI_REPO_ENCODED=$(echo "$CI_REPO" | sed 's|/|%2F|g')

                CI_ART_DATA=$(curl -sk -u "$AUTH" \
                  "$HARBOR_API/projects/cluster-images/repositories/$CI_REPO_ENCODED/artifacts?with_label=true&with_tag=true&page_size=10" 2>/dev/null)
                CI_DIGESTS=$(echo "$CI_ART_DATA" | jq -r '.[].digest // empty' 2>/dev/null || true)

                for CI_DIGEST in $CI_DIGESTS; do
                  [ -z "$CI_DIGEST" ] && continue
                  EXISTING_LABELS=$(echo "$CI_ART_DATA" | jq -r --arg d "$CI_DIGEST" \
                    '[.[] | select(.digest == $d) | .labels // [] | .[].name] | join(",")' 2>/dev/null)
                  case "$EXISTING_LABELS" in
                    *upstream-verified*|*upstream-unverified*) continue ;;
                  esac

                  # Repo path is the upstream reference (e.g., docker.io/istio/pilot)
                  CI_TAG=$(echo "$CI_ART_DATA" | jq -r --arg d "$CI_DIGEST" \
                    '.[] | select(.digest == $d) | (.tags // [])[0].name // empty')
                  [ -z "$CI_TAG" ] && continue

                  UPSTREAM_REF="$CI_REPO:$CI_TAG"
                  if cosign verify \
                      --certificate-identity-regexp='.*' \
                      --certificate-oidc-issuer-regexp='.*' \
                      "$UPSTREAM_REF" > /dev/null 2>&1; then
                    echo "  upstream-verified: $UPSTREAM_REF"
                    VERIFY_OK=$((VERIFY_OK + 1))
                    APPLY_LABEL_ID="$LABEL_VERIFIED_ID"
                  else
                    echo "  upstream-unverified: $UPSTREAM_REF"
                    VERIFY_FAIL=$((VERIFY_FAIL + 1))
                    APPLY_LABEL_ID="$LABEL_UNVERIFIED_ID"
                  fi

                  curl -sk -o /dev/null -u "$AUTH" \
                    -X POST "$HARBOR_API/projects/cluster-images/repositories/$CI_REPO_ENCODED/artifacts/$CI_DIGEST/labels" \
                    -H "Content-Type: application/json" \
                    -d "{\"id\":$APPLY_LABEL_ID}" 2>/dev/null || true
                done
              done

              # ── Non-proxy projects (CI/CD): sign with homelab key ──────
              CICD_PROJECTS=$(curl -sk -u "$AUTH" \
                "$HARBOR_API/projects?page_size=100" | \
                jq -r '.[] | select((.registry_id == 0 or .registry_id == null) and .name != "library") | .name' 2>/dev/null || true)

              for PROJECT in $CICD_PROJECTS; do
                SIG_REPOS=$(curl -sk -u "$AUTH" \
                  "$HARBOR_API/projects/$PROJECT/repositories?page_size=100" 2>/dev/null | \
                  jq -r '.[] | select(.artifact_count > 0) | .name' 2>/dev/null || true)

                for REPO_FULL in $SIG_REPOS; do
                  [ -z "$REPO_FULL" ] && continue
                  REPO="${REPO_FULL#*/}"
                  REPO_ENCODED=$(echo "$REPO" | sed 's|/|%2F|g')

                  ART_DATA=$(curl -sk -u "$AUTH" \
                    "$HARBOR_API/projects/$PROJECT/repositories/$REPO_ENCODED/artifacts?with_accessory=true&page_size=1" 2>/dev/null)
                  SIG_DIGEST=$(echo "$ART_DATA" | jq -r '.[0].digest // empty')
                  [ -z "$SIG_DIGEST" ] && continue

                  HAS_COSIGN=$(echo "$ART_DATA" | jq \
                    '[.[0].accessories // [] | .[] | select(.type == "signature.cosign")] | length')
                  [ "$HAS_COSIGN" != "0" ] && continue

                  HARBOR_REF="harbor.k8s.local/$PROJECT/$REPO@$SIG_DIGEST"
                  SIGN_ERR=$(COSIGN_PASSWORD="" cosign sign --yes \
                      --tlog-upload=false \
                      --key k8s://harbor/cosign-keypair \
                      --allow-http-registry=false \
                      --allow-insecure-registry=false \
                      "$HARBOR_REF" 2>&1) && {
                    echo "  signed: $PROJECT/$REPO (CI/CD)"
                    SIGN_COUNT=$((SIGN_COUNT + 1))
                  } || {
                    echo "  sign-failed: $PROJECT/$REPO ($SIGN_ERR)"
                  }
                done
              done

              echo "=== Complete ==="
              echo "  Repos indexed:      $INDEXED"
              echo "  Ghosts cleaned:     $CLEANED"
              echo "  Images imported:    $IMPORTED"
              echo "  Scans triggered:    $SCAN_COUNT"
              echo "  SBOMs triggered:    $SBOM_COUNT"
              echo "  Upstream verified:  $VERIFY_OK"
              echo "  Upstream unsigned:  $VERIFY_FAIL"
              echo "  Artifacts signed:   $SIGN_COUNT"
            env:
              - name: HARBOR_ADMIN_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: harbor-admin-password
                    key: HARBOR_ADMIN_PASSWORD
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "1Gi"
                cpu: "500m"
            volumeMounts:
              - name: ca-certs
                mountPath: /etc/ssl/certs/homelab
                readOnly: true
          volumes:
            - name: ca-certs
              configMap:
                name: homelab-ca-bundle
