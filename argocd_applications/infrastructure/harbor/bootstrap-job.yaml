apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-bootstrap
  namespace: harbor
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "3"
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: harbor-bootstrap
      restartPolicy: OnFailure
      containers:
      - name: bootstrap
        image: docker.io/library/alpine:3.19
        command:
        - /bin/sh
        - -c
        - |
          set -e
          apk add --no-cache curl jq

          HARBOR_API="https://harbor.k8s.local/api/v2.0"
          AUTH="admin:$HARBOR_ADMIN_PASSWORD"

          # ── Wait for Harbor API ────────────────────────────────────────
          echo "Waiting for Harbor API..."
          until curl -sk -u "$AUTH" "$HARBOR_API/systeminfo" | jq -e '.harbor_version' > /dev/null 2>&1; do
            echo "  Harbor not ready, retrying in 10s..."
            sleep 10
          done
          echo "Harbor API is up: $(curl -sk -u "$AUTH" "$HARBOR_API/systeminfo" | jq -r '.harbor_version')"

          # ── Helper: create registry endpoint + proxy cache project ─────
          create_proxy_cache() {
            local NAME="$1"
            local UPSTREAM_URL="$2"
            local REG_TYPE="$3"
            local DESCRIPTION="$4"

            # Check if project already exists
            if curl -sk -u "$AUTH" "$HARBOR_API/projects?name=$NAME" | jq -e '.[0].project_id' > /dev/null 2>&1; then
              echo "Project '$NAME' already exists, skipping."
              return 0
            fi

            # Create registry endpoint
            echo "Creating registry endpoint for $UPSTREAM_URL..."
            local REGISTRY_PAYLOAD=$(jq -n \
              --arg name "$NAME-upstream" \
              --arg url "$UPSTREAM_URL" \
              --arg type "$REG_TYPE" \
              '{name: $name, type: $type, url: $url, insecure: false}')

            local REG_RESULT=$(curl -sk -o /dev/null -w "%{http_code}" -u "$AUTH" \
              -X POST "$HARBOR_API/registries" \
              -H "Content-Type: application/json" \
              -d "$REGISTRY_PAYLOAD")

            if [ "$REG_RESULT" = "201" ] || [ "$REG_RESULT" = "409" ]; then
              echo "  Registry endpoint created (or exists): $REG_RESULT"
            else
              echo "  WARNING: Registry endpoint creation returned $REG_RESULT"
            fi

            # Get registry ID
            local REGISTRY_ID=$(curl -sk -u "$AUTH" "$HARBOR_API/registries?name=$NAME-upstream" | jq -r '.[0].id')
            if [ "$REGISTRY_ID" = "null" ] || [ -z "$REGISTRY_ID" ]; then
              echo "  ERROR: Could not find registry endpoint ID for $NAME-upstream"
              return 1
            fi

            # Create proxy cache project
            echo "Creating proxy cache project '$NAME' (registry_id=$REGISTRY_ID)..."
            local PROJECT_PAYLOAD=$(jq -n \
              --arg name "$NAME" \
              --argjson reg_id "$REGISTRY_ID" \
              '{project_name: $name, metadata: {public: "true"}, registry_id: $reg_id}')

            local PROJ_RESULT=$(curl -sk -o /dev/null -w "%{http_code}" -u "$AUTH" \
              -X POST "$HARBOR_API/projects" \
              -H "Content-Type: application/json" \
              -d "$PROJECT_PAYLOAD")

            if [ "$PROJ_RESULT" = "201" ]; then
              echo "  Project '$NAME' created successfully."
            elif [ "$PROJ_RESULT" = "409" ]; then
              echo "  Project '$NAME' already exists."
            else
              echo "  WARNING: Project creation returned $PROJ_RESULT"
            fi
          }

          # ── Create proxy cache projects for all upstream registries ────
          create_proxy_cache "dockerhub-cache"     "https://hub.docker.com"  "docker-hub"       "Docker Hub proxy cache"
          create_proxy_cache "quay-cache"           "https://quay.io"        "quay"              "Quay.io proxy cache"
          create_proxy_cache "k8s-registry-cache"   "https://registry.k8s.io" "docker-registry"  "Kubernetes registry proxy cache"
          create_proxy_cache "nvcr-cache"           "https://nvcr.io"        "docker-registry"  "NVIDIA Container Registry proxy cache"

          # OIDC authentication is pre-configured at deploy time via
          # CONFIG_OVERWRITE_JSON in the Harbor core container — no API
          # call needed here.

          # ── Configure daily vulnerability scan-all schedule ────────────
          echo "Configuring daily scan-all schedule (03:00 UTC)..."
          SCAN_PAYLOAD='{"schedule":{"type":"Custom","cron":"0 0 3 * * *"}}'
          SCAN_HTTP=$(curl -sk -o /dev/null -w "%{http_code}" -u "$AUTH" \
            -X POST "$HARBOR_API/system/scanAll/schedule" \
            -H "Content-Type: application/json" \
            -d "$SCAN_PAYLOAD")
          if [ "$SCAN_HTTP" = "201" ]; then
            echo "  Created."
          elif [ "$SCAN_HTTP" = "409" ] || [ "$SCAN_HTTP" = "200" ]; then
            curl -sk -o /dev/null -u "$AUTH" \
              -X PUT "$HARBOR_API/system/scanAll/schedule" \
              -H "Content-Type: application/json" \
              -d "$SCAN_PAYLOAD"
            echo "  Updated (already existed)."
          else
            echo "  WARNING: HTTP $SCAN_HTTP"
          fi

          # ── Configure weekly garbage collection (Sunday 02:00 UTC) ─────
          echo "Configuring weekly GC schedule..."
          GC_PAYLOAD='{"parameters":{"delete_untagged":true,"dry_run":false,"workers":1},"schedule":{"type":"Custom","cron":"0 0 2 * * 0"}}'
          GC_HTTP=$(curl -sk -o /dev/null -w "%{http_code}" -u "$AUTH" \
            -X POST "$HARBOR_API/system/gc/schedule" \
            -H "Content-Type: application/json" \
            -d "$GC_PAYLOAD")
          if [ "$GC_HTTP" = "201" ]; then
            echo "  Created."
          elif [ "$GC_HTTP" = "409" ] || [ "$GC_HTTP" = "200" ]; then
            curl -sk -o /dev/null -u "$AUTH" \
              -X PUT "$HARBOR_API/system/gc/schedule" \
              -H "Content-Type: application/json" \
              -d "$GC_PAYLOAD"
            echo "  Updated (already existed)."
          else
            echo "  WARNING: HTTP $GC_HTTP"
          fi

          # ── Configure 90-day tag retention per proxy-cache project ─────
          echo "Configuring 90-day tag retention policies..."
          configure_retention() {
            local PROJECT_NAME="$1"
            local PROJECT_DATA
            PROJECT_DATA=$(curl -sk -u "$AUTH" "$HARBOR_API/projects?name=$PROJECT_NAME")
            local PROJECT_ID
            PROJECT_ID=$(echo "$PROJECT_DATA" | jq -r '.[0].project_id')
            if [ "$PROJECT_ID" = "null" ] || [ -z "$PROJECT_ID" ]; then
              echo "  $PROJECT_NAME: not found, skipping."
              return 0
            fi

            # Proxy-cache projects have a default retention policy — get its ID
            local RETENTION_ID
            RETENTION_ID=$(curl -sk -u "$AUTH" \
              "$HARBOR_API/projects/$PROJECT_ID" | jq -r '.metadata.retention_id // empty')

            local PAYLOAD
            PAYLOAD=$(jq -n --argjson pid "$PROJECT_ID" '{
              algorithm: "or",
              rules: [{
                action: "retain",
                disabled: false,
                params: {nDaysSinceLastPull: "90"},
                scope_selectors: {
                  repository: [{kind: "doublestar", decoration: "repoMatches", pattern: "**"}]
                },
                tag_selectors: [{kind: "doublestar", decoration: "matches", pattern: "**"}],
                template: "nDaysSinceLastPull"
              }],
              scope: {level: "project", ref: $pid},
              trigger: {kind: "Schedule", settings: {cron: "0 0 0 * * *"}}
            }')

            local HTTP
            if [ -n "$RETENTION_ID" ]; then
              # Update existing retention policy
              HTTP=$(curl -sk -o /dev/null -w "%{http_code}" -u "$AUTH" \
                -X PUT "$HARBOR_API/retentions/$RETENTION_ID" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD")
              if [ "$HTTP" = "200" ]; then
                echo "  $PROJECT_NAME: updated to 90 days (retention $RETENTION_ID)."
              else
                echo "  $PROJECT_NAME: WARNING HTTP $HTTP"
              fi
            else
              # Create new retention policy
              HTTP=$(curl -sk -o /dev/null -w "%{http_code}" -u "$AUTH" \
                -X POST "$HARBOR_API/retentions" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD")
              if [ "$HTTP" = "201" ] || [ "$HTTP" = "200" ]; then
                echo "  $PROJECT_NAME: created (90 days since last pull)."
              else
                echo "  $PROJECT_NAME: WARNING HTTP $HTTP"
              fi
            fi
          }

          configure_retention "dockerhub-cache"
          configure_retention "quay-cache"
          configure_retention "k8s-registry-cache"
          configure_retention "nvcr-cache"

          echo "Harbor bootstrap complete."
        env:
          - name: HARBOR_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: harbor-admin-password
                key: HARBOR_ADMIN_PASSWORD
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        volumeMounts:
          - name: ca-certs
            mountPath: /etc/ssl/certs/homelab
            readOnly: true
      volumes:
        - name: ca-certs
          configMap:
            name: homelab-ca-bundle
