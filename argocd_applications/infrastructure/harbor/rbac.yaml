apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor-bootstrap
  namespace: harbor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harbor-bootstrap
  namespace: harbor
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: harbor-bootstrap
  namespace: harbor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: harbor-bootstrap
subjects:
  - kind: ServiceAccount
    name: harbor-bootstrap
    namespace: harbor
