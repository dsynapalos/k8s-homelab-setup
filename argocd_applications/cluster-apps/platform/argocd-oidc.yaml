apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-oidc
  namespace: argocd
  labels:
    category: security
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  source:
    repoURL: git@gitlab.com:dsynapalos/cluster-setup.git
    targetRevision: main
    path: argocd_applications/security/argocd-oidc
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
