---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: grafana
  name: grafana
spec:
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        supplementalGroups:
          - 0
      tolerations:
      - key: role
        operator: Equal
        value: platform
        effect: NoSchedule
      containers:
        - name: grafana
          image: harbor.k8s.local/dockerhub-cache/grafana/grafana:12.3.3
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SERVER_ROOT_URL
              value: "https://grafana.k8s.local"
            - name: GF_AUTH_GENERIC_OAUTH_ENABLED
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_NAME
              value: "Keycloak"
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
              value: "grafana"
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              value: "grafana-keycloak-secret"
            - name: GF_AUTH_GENERIC_OAUTH_SCOPES
              value: "openid profile email roles"
            - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
              value: "https://keycloak.k8s.local/realms/homelab/protocol/openid-connect/auth"
            - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
              value: "http://keycloak.security.svc.cluster.local:8080/realms/homelab/protocol/openid-connect/token"
            - name: GF_AUTH_GENERIC_OAUTH_API_URL
              value: "http://keycloak.security.svc.cluster.local:8080/realms/homelab/protocol/openid-connect/userinfo"
            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
              value: "contains(roles[*], 'cluster-admins') && 'Admin' || contains(roles[*], 'cluster-users') && 'Editor' || 'Viewer'"
            - name: GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_TLS_SKIP_VERIFY_INSECURE
              value: "false"
            - name: GF_AUTH_GENERIC_OAUTH_TLS_CLIENT_CA
              value: "/etc/ssl/certs/homelab/ca-certificates.crt"
            - name: GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN
              value: "true"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
          ports:
            - containerPort: 3000
              name: http-grafana
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /robots.txt
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 2
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: 3000
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards/dashboard-provider.yaml
              subPath: dashboard-provider.yaml
            - name: grafana-dashboard-json
              mountPath: /etc/grafana/provisioning/dashboards/k8s-cluster-dashboard.json
              subPath: k8s-cluster-dashboard.json
            - name: grafana-gpu-dashboard-json
              mountPath: /etc/grafana/provisioning/dashboards/nvidia-gpu-dashboard.json
              subPath: nvidia-gpu-dashboard.json
            - name: grafana-k8s-views-global-json
              mountPath: /etc/grafana/provisioning/dashboards/k8s-views-global.json
              subPath: k8s-views-global.json
            - name: grafana-k8s-views-namespaces-json
              mountPath: /etc/grafana/provisioning/dashboards/k8s-views-namespaces.json
              subPath: k8s-views-namespaces.json
            - name: grafana-k8s-views-nodes-json
              mountPath: /etc/grafana/provisioning/dashboards/k8s-views-nodes.json
              subPath: k8s-views-nodes.json
            - name: grafana-k8s-views-pods-json
              mountPath: /etc/grafana/provisioning/dashboards/k8s-views-pods.json
              subPath: k8s-views-pods.json
            - name: grafana-datasource-config
              mountPath: /etc/grafana/provisioning/datasources/prometheus-datasource.yaml
              subPath: prometheus-datasource.yaml
            - name: grafana-loki-datasource-config
              mountPath: /etc/grafana/provisioning/datasources/loki-datasource.yaml
              subPath: loki-datasource.yaml
            - name: homelab-ca
              mountPath: /etc/ssl/certs/homelab
              readOnly: true
      volumes:
        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: grafana-dashboard-json
          configMap:
            name: grafana-k8s-dashboard
        - name: grafana-gpu-dashboard-json
          configMap:
            name: grafana-gpu-dashboard
        - name: grafana-k8s-views-global-json
          configMap:
            name: grafana-k8s-views-global
        - name: grafana-k8s-views-namespaces-json
          configMap:
            name: grafana-k8s-views-namespaces
        - name: grafana-k8s-views-nodes-json
          configMap:
            name: grafana-k8s-views-nodes
        - name: grafana-k8s-views-pods-json
          configMap:
            name: grafana-k8s-views-pods
        - name: grafana-datasource-config
          configMap:
            name: grafana-prometheus-datasource
        - name: grafana-loki-datasource-config
          configMap:
            name: grafana-loki-datasource
        - name: homelab-ca
          configMap:
            name: homelab-ca-bundle

