apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml

configMapGenerator:
  - name: grafana-dashboard-provider
    files:
      - dashboard-provider.yaml
  - name: grafana-k8s-dashboard
    files:
      - dashboard_definitions/k8s-cluster-dashboard.json
  - name: grafana-gpu-dashboard
    files:
      - dashboard_definitions/nvidia-gpu-dashboard.json
  - name: grafana-k8s-views-global
    files:
      - dashboard_definitions/k8s-views-global.json
  - name: grafana-k8s-views-namespaces
    files:
      - dashboard_definitions/k8s-views-namespaces.json
  - name: grafana-k8s-views-nodes
    files:
      - dashboard_definitions/k8s-views-nodes.json
  - name: grafana-k8s-views-pods
    files:
      - dashboard_definitions/k8s-views-pods.json
  - name: grafana-prometheus-datasource
    files:
      - prometheus-datasource.yaml
  - name: grafana-loki-datasource
    files:
      - loki-datasource.yaml
  - name: grafana-jaeger-datasource
    files:
      - jaeger-datasource.yaml

generatorOptions:
  disableNameSuffixHash: false
