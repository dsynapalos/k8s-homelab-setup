apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - serviceaccount.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - node-daemonset.yaml
  - gateway-daemonset.yaml
  - otel-collector-local-service.yaml
  - otel-collector-cluster-service.yaml

configMapGenerator:
  # ── Node agent (all nodes) ──────────────────────────────────
  - name: otel-node-base-config
    files:
      - configs/otel-node-base-config.yaml
    options:
      immutable: true
  - name: otel-node-metrics-pipeline
    files:
      - configs/otel-node-metrics-pipeline.yaml
    options:
      immutable: true
  - name: otel-node-kubeletstats-pipeline
    files:
      - configs/otel-node-kubeletstats-pipeline.yaml
    options:
      immutable: true
  - name: otel-node-logs-pipeline
    files:
      - configs/otel-node-logs-pipeline.yaml
    options:
      immutable: true
  - name: otel-node-traces-pipeline
    files:
      - configs/otel-node-traces-pipeline.yaml
    options:
      immutable: true
  # ── Platform gateway (platform nodes) ───────────────────────
  - name: otel-gateway-base-config
    files:
      - configs/otel-gateway-base-config.yaml
    options:
      immutable: true
  - name: otel-gateway-metrics-pipeline
    files:
      - configs/otel-gateway-metrics-pipeline.yaml
    options:
      immutable: true
  - name: otel-gateway-logs-pipeline
    files:
      - configs/otel-gateway-logs-pipeline.yaml
    options:
      immutable: true
  - name: otel-gateway-traces-pipeline
    files:
      - configs/otel-gateway-traces-pipeline.yaml
    options:
      immutable: true
  - name: otel-gateway-apiserver-pipeline
    files:
      - configs/otel-gateway-apiserver-pipeline.yaml
    options:
      immutable: true
  - name: otel-gateway-k8s-cluster-pipeline
    files:
      - configs/otel-gateway-k8s-cluster-pipeline.yaml
    options:
      immutable: true
  - name: otel-gateway-k8s-events-pipeline
    files:
      - configs/otel-gateway-k8s-events-pipeline.yaml
    options:
      immutable: true
  - name: otel-gateway-k8s-objects-pipeline
    files:
      - configs/otel-gateway-k8s-objects-pipeline.yaml
    options:
      immutable: true
