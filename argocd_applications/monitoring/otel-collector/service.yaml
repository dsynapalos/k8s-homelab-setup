apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: monitoring
  labels:
    app: otel-collector
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8888"
spec:
  selector:
    app: otel-collector
  type: ClusterIP
  ports:
  - name: metrics
    protocol: TCP
    port: 8888
    targetPort: 8888
  - name: prom-exporter
    protocol: TCP
    port: 8889
    targetPort: 8889
  - name: otlp-grpc
    protocol: TCP
    port: 4317
    targetPort: 4317
  - name: otlp-http
    protocol: TCP
    port: 4318
    targetPort: 4318
