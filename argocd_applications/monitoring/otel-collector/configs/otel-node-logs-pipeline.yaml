# Logs pipeline: filelog receiver → OTLP forward to gateway.
#
# Merged into the node-agent base config at startup. Collects container
# logs from the node-local /var/log/pods directory. Kubernetes metadata
# (namespace, pod, container) is extracted from the file path.
#
# Logs are forwarded via OTLP to the platform gateway
# (otel-collector-cluster) which writes them to Loki.

receivers:
  filelog:
    include:
      - /var/log/pods/*/*/*.log
    exclude:
      - /var/log/pods/*/otel-collector/*.log
    start_at: end
    include_file_path: true
    include_file_name: false
    operators:
      # Extract namespace, pod, and container from the log path
      - type: regex_parser
        id: extract_metadata_from_filepath
        regex: '^.*\/(?P<namespace>[^_]+)_(?P<pod_name>[^_]+)_(?P<uid>[a-f0-9\-]+)\/(?P<container_name>[^\._]+)\/.*\.log$'
        parse_from: attributes["log.file.path"]
        cache:
          size: 128
      # Move parsed fields into resource attributes
      - type: move
        from: attributes.namespace
        to: resource["k8s.namespace.name"]
      - type: move
        from: attributes.pod_name
        to: resource["k8s.pod.name"]
      - type: move
        from: attributes.container_name
        to: resource["k8s.container.name"]
      - type: move
        from: attributes.uid
        to: resource["k8s.pod.uid"]
      # Parse CRI-O / containerd log format: <timestamp> <stream> <flags> <message>
      - type: regex_parser
        id: parser-cri
        regex: '^(?P<time>[^ ]+) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) ?(?P<log>.*)$'
        timestamp:
          parse_from: attributes.time
          layout_type: gotime
          layout: '2006-01-02T15:04:05.999999999Z07:00'
      - type: move
        from: attributes.log
        to: body
      - type: move
        from: attributes.stream
        to: attributes["log.iostream"]
      - type: remove
        field: attributes.logtag
      - type: remove
        field: attributes.time

processors:
  batch/logs:
    send_batch_size: 1024
    send_batch_max_size: 2048
    timeout: 5s

service:
  pipelines:
    logs:
      receivers: [filelog]
      processors: [batch/logs]
      exporters: [otlp/gateway]
