# Kubelet stats pipeline: kubeletstats receiver → OTLP forward to gateway.
#
# Queries the local kubelet's /stats/summary endpoint for container, pod,
# node, and volume resource metrics (CPU, memory, filesystem, network).
# Node-local — no leader election needed. Each DaemonSet pod scrapes only
# its own kubelet via the K8S_HOST_IP environment variable.
#
# Metrics are forwarded via OTLP to the platform gateway
# (otel-collector-cluster) which writes them to Thanos.

receivers:
  kubeletstats:
    auth_type: serviceAccount
    collection_interval: 10s
    endpoint: "https://${env:K8S_HOST_IP}:10250"
    insecure_skip_verify: true
    metric_groups:
      - node
      - pod
      - container
      - volume
    extra_metadata_labels:
      - container.id
      - k8s.volume.type
    k8s_api_config:
      auth_type: serviceAccount

processors:
  batch/kubeletstats:
    send_batch_size: 1024
    send_batch_max_size: 2048
    timeout: 5s

service:
  pipelines:
    metrics/kubeletstats:
      receivers: [kubeletstats]
      processors: [batch/kubeletstats]
      exporters: [otlp/gateway]
