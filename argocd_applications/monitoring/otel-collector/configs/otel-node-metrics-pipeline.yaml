# Metrics pipeline: Prometheus scrape → OTLP forward to gateway.
#
# Merged into the node-agent base config at startup. Defines the
# Prometheus receiver, filter processor, and pipeline wiring.
#
# Node-local scraping: Each DaemonSet pod only scrapes targets on its own
# node. The kubernetes-nodes, kubernetes-pods, and kubernetes-nodes-cadvisor
# jobs filter targets using the K8S_NODE_NAME environment variable injected
# from the downward API. This avoids duplicate metrics.
#
# Scraped metrics are forwarded via OTLP to the platform gateway
# (otel-collector-cluster) which writes them to Thanos. The otlp/gateway
# exporter is defined in otel-node-base-config.yaml.

receivers:
  prometheus:
    config:
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      scrape_configs:
        # Scrape the OTel Collector's own metrics
        - job_name: 'otel-collector'
          static_configs:
            - targets: ['localhost:8888']

        # Scrape the local node's kubelet metrics via the API server proxy.
        # Uses kubernetes_sd_configs to discover the node, then relabel to
        # proxy through kubernetes.default.svc:443/api/v1/nodes/<node>/proxy/metrics.
        - job_name: 'kubernetes-nodes'
          kubernetes_sd_configs:
            - role: node
          scheme: https
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          relabel_configs:
            # Keep only the node this collector instance runs on
            - source_labels: [__meta_kubernetes_node_name]
              regex: ${env:K8S_NODE_NAME}
              action: keep
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            - source_labels: [__meta_kubernetes_node_name]
              action: replace
              target_label: node
            - target_label: __address__
              replacement: kubernetes.default.svc:443
            - source_labels: [__meta_kubernetes_node_name]
              regex: (.+)
              target_label: __metrics_path__
              replacement: /api/v1/nodes/$${1}/proxy/metrics

          metric_relabel_configs:
            # Drop Kubernetes system node labels that have empty values
            # (e.g. node-role.kubernetes.io/control-plane=""), which cause
            # Thanos 409 "label set contains a label with empty name or value".
            - action: labeldrop
              regex: 'node_role_kubernetes_io_.*|node_kubernetes_io_.*'

        # Scrape pods running on the local node (annotation-based discovery)
        - job_name: 'kubernetes-pods'
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: true
            # Keep only pods scheduled on this node
            - source_labels: [__meta_kubernetes_pod_node_name]
              regex: ${env:K8S_NODE_NAME}
              action: keep
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
              action: replace
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $${1}:$${2}
              target_label: __address__
            - action: labelmap
              regex: __meta_kubernetes_pod_label_(.+)
            - source_labels: [__meta_kubernetes_namespace]
              action: replace
              target_label: kubernetes_namespace
            - source_labels: [__meta_kubernetes_pod_name]
              action: replace
              target_label: kubernetes_pod_name

        # Scrape service endpoints running on the local node (annotation-based).
        # Uses endpointslice role so we get the backing pod's node name for
        # node-local filtering. Catches services with prometheus.io/scrape
        # whose pods may not carry the annotation themselves.
        - job_name: 'kubernetes-services'
          kubernetes_sd_configs:
            - role: endpointslice
          relabel_configs:
            - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
              action: keep
              regex: true
            # Keep only endpoints whose backing pod runs on this node
            - source_labels: [__meta_kubernetes_endpointslice_endpoint_node_name]
              regex: ${env:K8S_NODE_NAME}
              action: keep
            - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
              action: replace
              target_label: __scheme__
              regex: (https?)
            - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
              action: replace
              target_label: __address__
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $${1}:$${2}
            - action: labelmap
              regex: __meta_kubernetes_service_label_(.+)
            - source_labels: [__meta_kubernetes_namespace]
              action: replace
              target_label: kubernetes_namespace
            - source_labels: [__meta_kubernetes_service_name]
              action: replace
              target_label: kubernetes_service_name
            - source_labels: [__meta_kubernetes_endpointslice_endpoint_node_name]
              action: replace
              target_label: node

        # Scrape cAdvisor on the local node (container resource metrics)
        # via the API server proxy, same pattern as kubernetes-nodes.
        - job_name: 'kubernetes-nodes-cadvisor'
          scrape_interval: 10s
          scrape_timeout: 10s
          scheme: https
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          kubernetes_sd_configs:
            - role: node
          relabel_configs:
            # Keep only the node this collector instance runs on
            - source_labels: [__meta_kubernetes_node_name]
              regex: ${env:K8S_NODE_NAME}
              action: keep
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            - source_labels: [__meta_kubernetes_node_name]
              action: replace
              target_label: node
            - target_label: __address__
              replacement: kubernetes.default.svc:443
            - source_labels: [__meta_kubernetes_node_name]
              regex: (.+)
              target_label: __metrics_path__
              replacement: /api/v1/nodes/$${1}/proxy/metrics/cadvisor
          metric_relabel_configs:
            - action: replace
              source_labels: [id]
              regex: '^/machine\.slice/machine-rkt\\x2d([^\\]+)\\.+/([^/]+)\.service$$'
              target_label: rkt_container_name
              replacement: '$${2}-$${1}'
            - action: replace
              source_labels: [id]
              regex: '^/system\.slice/(.+)\.service$$'
              target_label: systemd_service_name
              replacement: '$${1}'
            # Drop Kubernetes system node labels with empty values (same as kubernetes-nodes job)
            - action: labeldrop
              regex: 'node_role_kubernetes_io_.*|node_kubernetes_io_.*'

processors:
  batch:
    send_batch_size: 1024
    send_batch_max_size: 2048
    timeout: 5s

  filter:
    error_mode: ignore
    metrics:
      metric:
        - 'name == "container_tasks_state"'
        - 'name == "container_memory_failures_total"'
        - 'name == "container_blkio_device_usage_total"'

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [batch, filter]
      exporters: [otlp/gateway]
