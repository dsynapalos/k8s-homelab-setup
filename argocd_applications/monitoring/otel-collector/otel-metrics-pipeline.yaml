# Metrics pipeline: Prometheus scrape → Thanos remote write.
#
# Merged into the base config at startup. Defines all receivers, processors,
# and exporters needed for the metrics pipeline, plus the pipeline wiring.

receivers:
  prometheus:
    config:
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      scrape_configs:
        # Scrape the OTel Collector's own metrics
        - job_name: 'otel-collector'
          static_configs:
            - targets: ['localhost:8888']

        # Scrape Kubernetes API server
        - job_name: 'kubernetes-apiservers'
          kubernetes_sd_configs:
            - role: endpointslice
          scheme: https
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          relabel_configs:
            - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
              action: keep
              regex: default;kubernetes;https

        # Scrape Kubernetes nodes
        - job_name: 'kubernetes-nodes'
          kubernetes_sd_configs:
            - role: node
          scheme: https
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          relabel_configs:
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            - target_label: __address__
              replacement: kubernetes.default.svc:443
            - source_labels: [__meta_kubernetes_node_name]
              regex: (.+)
              target_label: __metrics_path__
              replacement: /api/v1/nodes/$${1}/proxy/metrics

        # Scrape Kubernetes pods (annotation-based discovery)
        - job_name: 'kubernetes-pods'
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: true
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
              action: replace
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $${1}:$${2}
              target_label: __address__
            - action: labelmap
              regex: __meta_kubernetes_pod_label_(.+)
            - source_labels: [__meta_kubernetes_namespace]
              action: replace
              target_label: kubernetes_namespace
            - source_labels: [__meta_kubernetes_pod_name]
              action: replace
              target_label: kubernetes_pod_name

        # Scrape Kubernetes services (annotation-based discovery)
        - job_name: 'kubernetes-services'
          kubernetes_sd_configs:
            - role: service
          relabel_configs:
            - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
              action: keep
              regex: true
            - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
              action: replace
              target_label: __scheme__
              regex: (https?)
            - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
              action: replace
              target_label: __address__
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $${1}:$${2}
            - action: labelmap
              regex: __meta_kubernetes_service_label_(.+)
            - source_labels: [__meta_kubernetes_namespace]
              action: replace
              target_label: kubernetes_namespace
            - source_labels: [__meta_kubernetes_service_name]
              action: replace
              target_label: kubernetes_service_name

        # Scrape cAdvisor (container resource metrics via kubelet proxy)
        - job_name: 'kubernetes-nodes-cadvisor'
          scrape_interval: 10s
          scrape_timeout: 10s
          scheme: https
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          kubernetes_sd_configs:
            - role: node
          relabel_configs:
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            - target_label: __address__
              replacement: kubernetes.default.svc:443
            - source_labels: [__meta_kubernetes_node_name]
              regex: (.+)
              target_label: __metrics_path__
              replacement: /api/v1/nodes/$${1}/proxy/metrics/cadvisor
          metric_relabel_configs:
            - action: replace
              source_labels: [id]
              regex: '^/machine\.slice/machine-rkt\\x2d([^\\]+)\\.+/([^/]+)\.service$$'
              target_label: rkt_container_name
              replacement: '$${2}-$${1}'
            - action: replace
              source_labels: [id]
              regex: '^/system\.slice/(.+)\.service$$'
              target_label: systemd_service_name
              replacement: '$${1}'

        # Scrape Node Exporter
        - job_name: 'node-exporter'
          kubernetes_sd_configs:
            - role: endpointslice
          relabel_configs:
          - source_labels: [__meta_kubernetes_endpointslice_name]
            regex: 'node-exporter'
            action: keep

        # Scrape kube-state-metrics
        - job_name: 'kube-state-metrics'
          kubernetes_sd_configs:
            - role: endpointslice
          relabel_configs:
          - source_labels: [__meta_kubernetes_endpointslice_name]
            regex: 'kube-state-metrics.*'
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: 'http-metrics'
            action: keep

processors:
  memory_limiter:
    limit_mib: 3200
    spike_limit_mib: 512
    check_interval: 5s

  # Remove resource attributes that arrive with empty values from kubelet/cAdvisor
  # scrapes (net.host.port, server.port). resource_to_telemetry_conversion would
  # promote these to metric labels with empty values, which Thanos Receive rejects
  # with HTTP 409 ("label set contains a label with empty name or value").
  transform:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - delete_key(attributes, "net.host.port") where attributes["net.host.port"] == ""
          - delete_key(attributes, "server.port") where attributes["server.port"] == ""

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    resource_to_telemetry_conversion:
      enabled: true

  prometheusremotewrite:
    endpoint: "http://thanos-receive.monitoring.svc.cluster.local:19291/api/v1/receive"
    tls:
      insecure: true
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [memory_limiter, transform]
      exporters: [prometheusremotewrite, prometheus]
