apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  namespace: monitoring
  labels:
    app: dcgm-exporter
spec:
  selector:
    matchLabels:
      app: dcgm-exporter
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: dcgm-exporter
    spec:
      nodeSelector:
        compute: cuda
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      runtimeClassName: nvidia
      containers:
      - name: dcgm-exporter
        image: harbor.k8s.local/nvcr-cache/nvidia/k8s/dcgm-exporter:3.3.5-3.4.1-ubuntu22.04
        imagePullPolicy: IfNotPresent
        ports:
        - name: metrics
          containerPort: 9400
          protocol: TCP
        env:
        - name: DCGM_EXPORTER_LISTEN
          value: ":9400"
        - name: DCGM_EXPORTER_KUBERNETES
          value: "true"
        - name: DCGM_EXPORTER_COLLECTORS
          value: "/etc/dcgm-exporter/dcp-metrics-included.csv"
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          privileged: true
          capabilities:
            add:
            - SYS_ADMIN
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
            nvidia.com/gpu: 1
          limits:
            cpu: 200m
            memory: 256Mi
            nvidia.com/gpu: 1
        volumeMounts:
        - name: pod-gpu-resources
          mountPath: /var/lib/kubelet/pod-resources
          readOnly: true
      volumes:
      - name: pod-gpu-resources
        hostPath:
          path: /var/lib/kubelet/pod-resources
          type: Directory
