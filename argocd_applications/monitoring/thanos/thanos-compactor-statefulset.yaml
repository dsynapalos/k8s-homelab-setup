apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-compactor
  namespace: monitoring
  labels:
    app: thanos-compactor
spec:
  serviceName: thanos-compactor
  replicas: 1
  selector:
    matchLabels:
      app: thanos-compactor
  template:
    metadata:
      labels:
        app: thanos-compactor
    spec:
      serviceAccountName: thanos
      securityContext:
        fsGroup: 65534
      tolerations:
      - key: role
        operator: Equal
        value: platform
        effect: NoSchedule
      initContainers:
      - name: config-init
        image: harbor.k8s.local/dockerhub-cache/library/busybox:1.36
        command:
        - sh
        - -c
        - |
          cat > /etc/thanos/objstore.yml <<EOF
          type: S3
          config:
            bucket: "$(cat /s3-config/BUCKET_NAME)"
            endpoint: "$(cat /s3-config/BUCKET_HOST):$(cat /s3-config/BUCKET_PORT)"
            access_key: "$(cat /s3-secret/AWS_ACCESS_KEY_ID)"
            secret_key: "$(cat /s3-secret/AWS_SECRET_ACCESS_KEY)"
            insecure: true
          EOF
        volumeMounts:
        - name: objstore-config
          mountPath: /etc/thanos
        - name: s3-config
          mountPath: /s3-config
          readOnly: true
        - name: s3-secret
          mountPath: /s3-secret
          readOnly: true
      containers:
      - name: thanos-compactor
        image: harbor.k8s.local/quay-cache/thanos/thanos:v0.41.0
        args:
        - compact
        - --log.level=info
        - --data-dir=/data
        - --http-address=0.0.0.0:10902
        - --objstore.config-file=/etc/thanos/objstore.yml
        - --wait
        - --retention.resolution-raw=30d
        - --retention.resolution-5m=90d
        - --retention.resolution-1h=180d
        ports:
        - name: http
          containerPort: 10902
        volumeMounts:
        - name: data
          mountPath: /data
        - name: objstore-config
          mountPath: /etc/thanos
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 10902
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 10902
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: objstore-config
        emptyDir: {}
      - name: s3-config
        configMap:
          name: thanos-bucket
      - name: s3-secret
        secret:
          secretName: thanos-bucket
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      storageClassName: rook-ceph-block
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
