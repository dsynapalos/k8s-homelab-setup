apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-receive
  namespace: monitoring
  labels:
    app: thanos-receive
spec:
  serviceName: thanos-receive
  replicas: 1
  selector:
    matchLabels:
      app: thanos-receive
  template:
    metadata:
      labels:
        app: thanos-receive
    spec:
      serviceAccountName: thanos
      securityContext:
        fsGroup: 65534
      initContainers:
      - name: config-init
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          cat > /etc/thanos/objstore.yml <<EOF
          type: S3
          config:
            bucket: "$(cat /s3-config/BUCKET_NAME)"
            endpoint: "$(cat /s3-config/BUCKET_HOST):$(cat /s3-config/BUCKET_PORT)"
            access_key: "$(cat /s3-secret/AWS_ACCESS_KEY_ID)"
            secret_key: "$(cat /s3-secret/AWS_SECRET_ACCESS_KEY)"
            insecure: true
          EOF
        volumeMounts:
        - name: objstore-config
          mountPath: /etc/thanos
        - name: s3-config
          mountPath: /s3-config
          readOnly: true
        - name: s3-secret
          mountPath: /s3-secret
          readOnly: true
      containers:
      - name: thanos-receive
        image: quay.io/thanos/thanos:v0.36.1
        args:
        - receive
        - --log.level=info
        - --tsdb.path=/data/tsdb
        - --grpc-address=0.0.0.0:10901
        - --http-address=0.0.0.0:10902
        - --remote-write.address=0.0.0.0:19291
        - --label=receive_replica="$(POD_NAME)"
        - --label=receive_cluster="homelab"
        - --objstore.config-file=/etc/thanos/objstore.yml
        - --tsdb.retention=2h
        - --tsdb.out-of-order.time-window=5m
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - name: grpc
          containerPort: 10901
        - name: http
          containerPort: 10902
        - name: remote-write
          containerPort: 19291
        volumeMounts:
        - name: data
          mountPath: /data
        - name: objstore-config
          mountPath: /etc/thanos
        resources:
          requests:
            cpu: 10m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 10902
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 10902
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: objstore-config
        emptyDir: {}
      - name: s3-config
        configMap:
          name: thanos-bucket
      - name: s3-secret
        secret:
          secretName: thanos-bucket
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      storageClassName: rook-ceph-block
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
