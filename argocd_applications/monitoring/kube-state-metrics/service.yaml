---
kind: Service
apiVersion: v1
metadata:
  name: kube-state-metrics
  namespace: monitoring
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '8080'
spec:
  selector:
    app.kubernetes.io/component: exporter
    app.kubernetes.io/name: kube-state-metrics
  ports:
  - name: http-metrics
    protocol: TCP
    port: 8080
    targetPort: 8080
  - name: telemetry
    protocol: TCP
    port: 8081
    targetPort: 8081
