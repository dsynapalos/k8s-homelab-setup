apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  url: "https://argocd.k8s.local"
  oidc.config: |
    name: Keycloak
    issuer: https://keycloak.k8s.local/realms/homelab
    clientID: argocd
    clientSecret: argocd-keycloak-secret
    requestedScopes:
      - openid
      - profile
      - email
      - roles
  # Re-enable Application health assessment (removed in ArgoCD 1.8).
  # Required for app-of-apps sync-wave ordering — without this,
  # Application CRDs are considered immediately Healthy and waves
  # proceed without waiting for child apps to finish syncing.
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      -- Block sync-wave progression until at least one sync has
      -- completed.  Without this guard a freshly-created Application
      -- (no managed resources yet) is reported as Healthy, causing
      -- ArgoCD to advance to the next wave before child apps exist.
      if obj.status.operationState == nil then
        hs.status = "Progressing"
        hs.message = "Waiting for first sync"
      elseif obj.status.operationState.phase == "Running" then
        hs.status = "Progressing"
        hs.message = "Sync operation running"
      end
    end
    return hs
