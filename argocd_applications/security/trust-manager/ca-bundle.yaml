apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: homelab-ca-bundle
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  sources:
    - useDefaultCAs: true
    - secret:
        name: homelab-ca-secret
        key: ca.crt
  target:
    configMap:
      key: ca-certificates.crt
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
