apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: argocd-tls-certs-cm
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  sources:
    - secret:
        name: homelab-ca-secret
        key: ca.crt
  target:
    configMap:
      key: keycloak.k8s.local
    additionalFormats:
      jks:
        key: truststore.jks
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: argocd
