- name: display root CA trust instructions
  hosts: localhost
  gather_facts: false
  become: false
  tasks:
    - name: fetch root CA from cluster
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: homelab-ca-secret
        namespace: cert-manager
        kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default('~/.kube/config', true) }}"
      register: ca_secret
      no_log: true

    - name: verify secret was found
      ansible.builtin.assert:
        that: ca_secret.resources | length > 0
        fail_msg: "homelab-ca-secret not found in cert-manager namespace — is the cluster running?"

    - name: print root CA trust instructions
      vars:
        cert_b64: "{{ ca_secret.resources[0].data['ca.crt'] }}"
      ansible.builtin.debug:
        msg: |

          ╔══════════════════════════════════════════════════════════════════╗
          ║           HOMELAB ROOT CA — BROWSER TRUST SETUP                ║
          ╠══════════════════════════════════════════════════════════════════╣
          ║                                                                ║
          ║  Your browser must trust the homelab root CA to access         ║
          ║  ingress websites (e.g. harbor.k8s.local, grafana.k8s.local)  ║
          ║  without certificate warnings.                                 ║
          ║                                                                ║
          ║  Copy the script for your OS and paste it into a terminal.     ║
          ║  Restart your browser afterwards.                              ║
          ║                                                                ║
          ╚══════════════════════════════════════════════════════════════════╝

          ────────────────────────────────────────────────────────────────────
           WINDOWS  (Administrator PowerShell)
          ────────────────────────────────────────────────────────────────────

          [IO.File]::WriteAllBytes("$env:TEMP\homelab-root-ca.crt", [Convert]::FromBase64String("{{ cert_b64 }}"))
          Import-Certificate -FilePath "$env:TEMP\homelab-root-ca.crt" -CertStoreLocation Cert:\LocalMachine\Root
          Remove-Item "$env:TEMP\homelab-root-ca.crt"
          Write-Host "Homelab Root CA imported successfully" -ForegroundColor Green

          ────────────────────────────────────────────────────────────────────
           LINUX  (sudo required)
          ────────────────────────────────────────────────────────────────────

          echo '{{ cert_b64 }}' | base64 -d | sudo tee /usr/local/share/ca-certificates/homelab-root-ca.crt > /dev/null
          sudo update-ca-certificates
          echo "Homelab Root CA imported successfully"

          ────────────────────────────────────────────────────────────────────
           macOS  (Terminal)
          ────────────────────────────────────────────────────────────────────

          echo '{{ cert_b64 }}' | base64 -D > /tmp/homelab-root-ca.crt
          sudo security add-trusted-cert -d -r trustRoot \
              -k /Library/Keychains/System.keychain /tmp/homelab-root-ca.crt
          rm /tmp/homelab-root-ca.crt
          echo "Homelab Root CA imported successfully"

          ────────────────────────────────────────────────────────────────────
           Restart your browser after importing the certificate.
          ────────────────────────────────────────────────────────────────────
