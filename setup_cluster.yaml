- name: test ansible runner
  hosts: localhost
  become: false
  gather_facts: true
  roles:
    - test_ansible_runner
    - setup_localhost

- name: provision infrastructure
  hosts: proxmox
  gather_facts: false
  become: true
  strategy: free
  any_errors_fatal: true
  roles:
    - provision_infra

- name: setup k8s cluster master nodes
  hosts: k8s-control
  gather_facts: false
  become: true
  roles:
    - setup_cluster_master

- name: setup k8s cluster worker nodes
  hosts: k8s-nodes
  gather_facts: true
  become: true
  roles:
    - setup_cluster_node

- name: generate homelab PKI
  hosts: k8s-control
  gather_facts: false
  become: true
  roles:
    - setup_pki

- name: distribute root CA and configure registry mirrors
  hosts: k8s
  gather_facts: false
  become: true
  roles:
    - distribute_pki

- name: setup cillium networking
  hosts: k8s
  gather_facts: false
  become: true
  roles:
    - bootstrap_cillium

- name: setup istio ambient service mesh
  hosts: k8s-control
  gather_facts: false
  become: true
  roles:
    - bootstrap_istio_ambient

- name: setup nvidia device plugin
  hosts: localhost
  gather_facts: false
  become: false
  roles:
    - bootstrap_nvidia_device_plugin

- name: setup argo cd
  hosts: localhost
  gather_facts: true
  become: true
  roles:
    - bootstrap_argocd

- name: bootstrap Sveltos orchestration
  hosts: localhost
  gather_facts: false
  become: false
  roles:
    - role: bootstrap_sveltos
      when: lookup('env', 'ENABLE_SVELTOS') == 'true'

- name: bootstrap PKI secret for cert-manager
  hosts: localhost
  gather_facts: false
  become: false
  roles:
    - bootstrap_pki_secret

- name: bootstrap Harbor admin secret
  hosts: localhost
  gather_facts: false
  become: false
  roles:
    - bootstrap_harbor_secret

- name: setup storage classes
  hosts: localhost
  gather_facts: false
  become: false
  roles:
    - role: bootstrap_cephfs_storage_class
      when: lookup('env', 'ENABLE_CEPH') == 'true'
    - role: bootstrap_rook_ceph
      when:
        - lookup('env', 'ENABLE_ROOK') == 'true'
        - lookup('env', 'ENABLE_SVELTOS') != 'true'

- name: setup applications
  hosts: localhost
  gather_facts: false
  become: true
  roles:
    - bootstrap_applications

- name: display root CA trust instructions
  hosts: localhost
  gather_facts: false
  become: false
  tasks:
    - name: read root CA certificate
      ansible.builtin.slurp:
        src: /tmp/homelab-pki/root-ca.crt
      register: root_ca

    - name: print root CA trust instructions
      vars:
        cert_b64: "{{ root_ca.content }}"
      ansible.builtin.debug:
        msg: |

          ╔══════════════════════════════════════════════════════════════════╗
          ║           HOMELAB ROOT CA — BROWSER TRUST SETUP                ║
          ╠══════════════════════════════════════════════════════════════════╣
          ║                                                                ║
          ║  Your browser must trust the homelab root CA to access         ║
          ║  ingress websites (e.g. harbor.k8s.local, grafana.k8s.local)  ║
          ║  without certificate warnings.                                 ║
          ║                                                                ║
          ║  Copy the script for your OS and paste it into a terminal.     ║
          ║  Restart your browser afterwards.                              ║
          ║                                                                ║
          ╚══════════════════════════════════════════════════════════════════╝

          ────────────────────────────────────────────────────────────────────
           WINDOWS  (Administrator PowerShell)
          ────────────────────────────────────────────────────────────────────

          [IO.File]::WriteAllBytes("$env:TEMP\homelab-root-ca.crt", [Convert]::FromBase64String("{{ cert_b64 }}"))
          Import-Certificate -FilePath "$env:TEMP\homelab-root-ca.crt" -CertStoreLocation Cert:\LocalMachine\Root
          Remove-Item "$env:TEMP\homelab-root-ca.crt"
          Write-Host "Homelab Root CA imported successfully" -ForegroundColor Green

          ────────────────────────────────────────────────────────────────────
           LINUX  (sudo required)
          ────────────────────────────────────────────────────────────────────

          echo '{{ cert_b64 }}' | base64 -d | sudo tee /usr/local/share/ca-certificates/homelab-root-ca.crt > /dev/null
          sudo update-ca-certificates
          echo "Homelab Root CA imported successfully"

          ────────────────────────────────────────────────────────────────────
           macOS  (Terminal)
          ────────────────────────────────────────────────────────────────────

          echo '{{ cert_b64 }}' | base64 -D > /tmp/homelab-root-ca.crt
          sudo security add-trusted-cert -d -r trustRoot \
              -k /Library/Keychains/System.keychain /tmp/homelab-root-ca.crt
          rm /tmp/homelab-root-ca.crt
          echo "Homelab Root CA imported successfully"

          ────────────────────────────────────────────────────────────────────
           Restart your browser after importing the certificate.
          ────────────────────────────────────────────────────────────────────
  