apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: metrics-server
spec:
  clusterSelector:
    matchLabels:
      cluster: homelab
  syncMode: Continuous
  dependsOn:
    - harbor
  policyRefs:
    - kind: ConfigMap
      name: sveltos-app-metrics-server
      namespace: projectsveltos
      deploymentType: Remote
