apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: dragonfly
spec:
  clusterSelector:
    matchLabels:
      cluster: homelab
  syncMode: Continuous
  dependsOn:
    - cert-manager
    - trust-manager
    - rook-ceph-cluster
  policyRefs:
    - kind: ConfigMap
      name: sveltos-app-dragonfly
      namespace: projectsveltos
      deploymentType: Remote
  validateHealths:
    - name: dragonfly-manager
      featureID: Resources
      group: apps
      version: v1
      kind: Deployment
      name: dragonfly-manager
      namespace: dragonfly-system
      script: |
        function evaluate()
          hs = {}
          hs.healthy = false
          hs.message = "available replicas not matching requested replicas"
          if obj.status ~= nil and obj.status.availableReplicas ~= nil then
            if obj.status.availableReplicas == obj.spec.replicas then
              hs.healthy = true
            end
          end
          return hs
        end
    - name: dragonfly-client
      featureID: Resources
      group: apps
      version: v1
      kind: DaemonSet
      name: dragonfly-client
      namespace: dragonfly-system
      script: |
        function evaluate()
          hs = {}
          hs.healthy = false
          hs.message = "not all dfdaemon pods are ready"
          if obj.status ~= nil then
            if obj.status.numberReady == obj.status.desiredNumberScheduled then
              hs.healthy = true
            end
          end
          return hs
        end
