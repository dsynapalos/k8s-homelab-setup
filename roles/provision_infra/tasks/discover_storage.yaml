---
# Discover available secondary storage on the Proxmox host for this VM.
# This task discovers raw disks that can be used for VM secondary storage
# (for Rook-Ceph, additional data volumes, etc.)
#
# NOTE: Secondary storage setup is now handled per-cluster in
# setup_localhost/tasks/setup_secondary_storage.yaml before this play runs.
# This file is kept for reference but is NOT included from main.yaml.

- name: Discover Proxmox storage availability
  ansible.builtin.script: discover_storage.py
  args:
    executable: "{{ playbook_dir }}/library/.venv_proxmox/bin/python3"
  no_log: true
  environment:
    PROXMOX_HOST: "{{ proxmox_api_host }}"
    PROXMOX_USER: "{{ proxmox_api_user }}"
    PROXMOX_PASSWORD: "{{ proxmox_api_password }}"
    PROXMOX_VERIFY_SSL: "{{ proxmox_verify_ssl | default('false') }}"
    PROXMOX_NODE: "{{ proxmox_node }}"
  delegate_to: localhost
  register: storage_discovery_result

- name: Parse storage discovery results
  ansible.builtin.set_fact:
    proxmox_storage_info: "{{ storage_discovery_result.stdout | from_json }}"
  run_once: true

- name: Display discovered storage
  ansible.builtin.debug:
    msg: |
      OS Disk: {{ proxmox_storage_info.os_disk.devpath | default('unknown') }} ({{ proxmox_storage_info.os_disk.size_gib | default(0) }} GiB)
      Secondary Disks Available: {{ proxmox_storage_info.secondary_disks | length }}
      Total Secondary Storage: {{ proxmox_storage_info.total_secondary_gib }} GiB
      {% for disk in proxmox_storage_info.secondary_disks %}
      - {{ disk.devpath }}: {{ disk.size_gib }} GiB ({{ disk.model }})
      {% endfor %}
  run_once: true

- name: Set secondary disk device paths
  ansible.builtin.set_fact:
    secondary_disk_devices: "{{ proxmox_storage_info.secondary_disks | map(attribute='devpath') | list }}"
    secondary_disk_sizes_gib: "{{ proxmox_storage_info.secondary_disks | map(attribute='size_gib') | list }}"
  run_once: true
  when: proxmox_storage_info.secondary_disks | length > 0
