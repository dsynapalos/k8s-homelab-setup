---
# Cleanup cluster role: Destroy VMs and clean up secondary storage
#
# This role reverses the provisioning done by setup_localhost + provision_infra:
# 1. Destroys all VMs defined in the inventory on each Proxmox cluster
# 2. Removes Proxmox secondary storage pool registrations per cluster
# 3. Cleans up LVM structures (thin pools, VGs, PVs) on secondary disks
# 4. Wipes disk signatures so disks are clean for the next provisioning run
#
# Runs entirely on localhost, iterating over each Proxmox cluster in the
# proxmox_cluster map from inventory/localhost.yaml.

- name: Display all VMs targeted for destruction
  ansible.builtin.debug:
    msg: |
      VMs to destroy across all Proxmox clusters:
      {{ ((groups['k8s-control'] | default([])) + (groups['k8s-nodes'] | default([]))) | join(', ') }}

# Loop over each Proxmox cluster and clean up VMs + storage
- name: Clean up each Proxmox cluster
  include_tasks: cleanup_proxmox_cluster.yaml
  loop: "{{ proxmox_cluster | dict2items }}"
  loop_control:
    loop_var: pxcluster
    label: "{{ pxcluster.key }}"

- name: Remove local kubeconfig
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.kube/config"
    state: absent
  ignore_errors: true

- name: Cleanup summary
  ansible.builtin.debug:
    msg: |
      === Cleanup Complete ===
      Proxmox clusters cleaned: {{ proxmox_cluster | length }}
      
      The secondary disks are now clean and will be auto-discovered
      as available storage on the next 'python3 setup-clusters.py' run.
