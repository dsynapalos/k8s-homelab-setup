# Kernel Network Configuration - enable packet forwarding for pod-to-pod routing
- name: enable IP forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'  # Required for Kubernetes networking (pods route through node)
    sysctl_set: true  # Apply immediately and persist across reboots

# Reduce TCP SYN timeout so connections to unreachable services (e.g. Harbor
# proxy-cache mirrors before CoreDNS/Cilium are running) fail within ~15 s
# instead of the default ~130 s.  This lets CRI-O fall back from an
# unavailable mirror to the upstream registry quickly during first boot.
- name: reduce TCP SYN retries for faster mirror fallback
  ansible.posix.sysctl:
    name: net.ipv4.tcp_syn_retries
    value: '3'
    sysctl_set: true

# Common Firewall Rules - TCP ports needed on all K8s nodes
- name: allow common k8s tcp ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    state: enabled
  loop:
    - 22          # SSH access for management
    - 4240        # Cilium health checks
    - 4244:4245   # Cilium Hubble server and relay
    - 4250        # Cilium metrics
    - 10250       # kubelet API (node communication)

# Common Firewall Rules - UDP ports for Cilium networking on all nodes
- name: allow cilium vxlan and wireguard
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: udp
    state: enabled
  loop:
    - 8472   # VXLAN tunnel encapsulation (overlay network between nodes)
    - 51871  # WireGuard encrypted tunnel (pod-to-pod traffic encryption)

# Control Plane Firewall Rules - ports specific to K8s control plane components
- name: allow k8s control plane ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    state: enabled
  loop:
    - 6443        # Kubernetes API server (primary cluster access)
    - 2379:2380   # etcd server and peer communication (cluster state storage)
    - 10257       # kube-controller-manager
    - 10259       # kube-scheduler
  when: inventory_hostname in groups['k8s-control']

# Worker Node Firewall Rules - ports specific to workload nodes
- name: allow k8s worker node ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - 80          # HTTP ingress traffic (LoadBalancer/Ingress services)
    - 443         # HTTPS ingress traffic (LoadBalancer/Ingress services)
    - 10256       # kube-proxy health checks (when not using Cilium replacement)
  when: inventory_hostname in groups['k8s-nodes']

# NodePort Service Range - allow external access to NodePort services
- name: allow k8s nodeport range
  community.general.ufw:
    rule: allow
    port: 30000:32767  # Standard Kubernetes NodePort range (Service.spec.type=NodePort)
    proto: "{{ item }}"
    state: enabled
  loop:
    - tcp  # NodePort TCP services
    - udp  # NodePort UDP services
  when: inventory_hostname in groups['k8s-nodes']