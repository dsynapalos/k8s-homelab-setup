---
# Distribute Root CA Role
# Installs the root CA certificate on all K8s nodes so CRI-O (and all
# system tools) trust TLS certificates issued by the homelab CA chain.
# Also configures CRI-O registry mirrors to route pulls through Dragonfly
# P2P (127.0.0.1:4001) with Harbor proxy-cache path prefixes, falling
# back to the original upstream registry when Dragonfly is down.
# Sets up systemd-resolved to forward *.k8s.local queries to kube-dns
# (CoreDNS), which rewrites them to the Cilium Ingress service.

- name: install root CA certificate
  ansible.builtin.copy:
    src: /tmp/homelab-pki/root-ca.crt
    dest: /usr/local/share/ca-certificates/homelab-root-ca.crt
    mode: '0644'
  register: root_ca_installed

- name: update system CA trust store
  ansible.builtin.command: update-ca-certificates
  changed_when: root_ca_installed.changed
  when: root_ca_installed.changed

- name: configure CRI-O registry mirrors for Dragonfly P2P
  ansible.builtin.copy:
    content: |
      # Route image pulls through the local Dragonfly dfdaemon proxy.
      # Path prefixes encode the Harbor proxy-cache project so that
      # Dragonfly → Harbor → upstream works transparently.
      # Fallback order: Dragonfly (P2P) → upstream registry (direct).

      [[registry]]
      prefix = "docker.io"
      location = "docker.io"

      [[registry.mirror]]
      location = "127.0.0.1:4001/dockerhub-cache"
      insecure = true

      [[registry]]
      prefix = "quay.io"
      location = "quay.io"

      [[registry.mirror]]
      location = "127.0.0.1:4001/quay-cache"
      insecure = true

      [[registry]]
      prefix = "registry.k8s.io"
      location = "registry.k8s.io"

      [[registry.mirror]]
      location = "127.0.0.1:4001/k8s-registry-cache"
      insecure = true

      [[registry]]
      prefix = "nvcr.io"
      location = "nvcr.io"

      [[registry.mirror]]
      location = "127.0.0.1:4001/nvcr-cache"
      insecure = true
    dest: /etc/containers/registries.conf.d/harbor-mirror.conf
    mode: '0644'
  register: registry_mirror_config

# Cap no-progress image pull time so a stalled mirror attempt is cancelled
# before the helm post-install hook timeout expires.
- name: configure CRI-O image pull progress timeout
  ansible.builtin.copy:
    content: |
      # Cancel an image pull if no progress is made for 2 minutes.
      # This acts as a safety net: the tcp_syn_retries sysctl makes
      # individual mirror connections fail in ~15 s, but if something
      # else stalls (TLS handshake, slow layer download) this timeout
      # ensures the pull does not hang indefinitely.
      [crio.image]
      pull_progress_timeout = "2m"
    dest: /etc/crio/crio.conf.d/10-pull-timeouts.conf
    mode: '0644'
  register: pull_timeout_config

- name: restart CRI-O to pick up CA and registry changes
  ansible.builtin.systemd_service:
    name: crio.service
    state: restarted
  when: root_ca_installed.changed or registry_mirror_config.changed or pull_timeout_config.changed

# --- Node DNS: forward *.k8s.local to kube-dns (CoreDNS) ---
# CoreDNS rewrites *.k8s.local → cilium-ingress.kube-system.svc.cluster.local
# so all *.k8s.local ingress hostnames resolve without hardcoded IPs.
# The kube-dns ClusterIP is read from kubelet's own config (no hardcoding).

- name: read kube-dns ClusterIP from kubelet config
  ansible.builtin.shell: |
    set -o pipefail
    grep -A1 'clusterDNS:' /var/lib/kubelet/config.yaml | tail -1 | tr -d ' -'
  args:
    executable: /bin/bash
  register: kube_dns_ip
  changed_when: false

- name: create systemd-resolved drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: '0755'

- name: configure systemd-resolved to forward k8s.local to kube-dns
  ansible.builtin.copy:
    content: |
      # Forward *.k8s.local DNS queries to kube-dns (CoreDNS).
      # CoreDNS rewrites them to the Cilium Ingress service ClusterIP,
      # so CRI-O and other host-level tools can resolve ingress hostnames
      # (e.g. harbor.k8s.local) without hardcoded /etc/hosts entries.
      [Resolve]
      DNS={{ kube_dns_ip.stdout }}
      Domains=~k8s.local
    dest: /etc/systemd/resolved.conf.d/k8s-local.conf
    mode: '0644'
  register: resolved_config

- name: restart systemd-resolved to pick up k8s.local forwarding
  ansible.builtin.systemd_service:
    name: systemd-resolved.service
    state: restarted
  when: resolved_config.changed
