---
# Setup secondary storage pools on each Proxmox host for VM disk provisioning.
# This runs on localhost BEFORE VM provisioning to ensure pools exist on every
# Proxmox cluster. Each cluster's secondary disk spec is cached in
# cached_secondary_disks_spec[cluster_key] so provision_infra can reference
# the correct spec per host.

- name: Initialize per-cluster secondary disks cache
  ansible.builtin.set_fact:
    cached_secondary_disks_spec: {}
    cacheable: true

- name: Setup secondary storage for each Proxmox cluster
  include_tasks: setup_storage_for_cluster.yaml
  loop: "{{ proxmox_cluster | dict2items }}"
  loop_control:
    loop_var: pxcluster
    label: "{{ pxcluster.key }}"

- name: Display per-cluster disk allocations
  ansible.builtin.debug:
    msg: |
      === Secondary storage allocation summary ===
      {% for cluster_key, spec in cached_secondary_disks_spec.items() %}
      {{ cluster_key }}: {{ spec if spec else 'No secondary storage' }}
      {% endfor %}
