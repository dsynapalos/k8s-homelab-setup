- name: create argocd namespace
  ansible.builtin.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: argocd
    kubeconfig: /etc/kubernetes/new_cluster_admin.conf

- name: install argocd
  ansible.builtin.k8s:
    state: present
    src: https://raw.githubusercontent.com/argoproj/argo-cd/v{{ ARGOCD_VERSION }}/manifests/install.yaml
    namespace: argocd
    kubeconfig: /etc/kubernetes/new_cluster_admin.conf
  retries: 5
  delay: 15
  register: argocd_install_result
  until: argocd_install_result is success

# Patch ArgoCD workloads to tolerate infra-tainted nodes.
# ArgoCD's upstream manifests tolerate control-plane taints but not custom role taints.
- name: add infra taint toleration to ArgoCD deployments
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ item }}"
        namespace: argocd
      spec:
        template:
          spec:
            tolerations:
            - key: role
              operator: Equal
              value: infra
              effect: NoSchedule
    kubeconfig: /etc/kubernetes/new_cluster_admin.conf
    merge_type: strategic-merge
  loop:
    - argocd-server
    - argocd-repo-server
    - argocd-redis
    - argocd-dex-server
    - argocd-notifications-controller
    - argocd-applicationset-controller

- name: add infra taint toleration to ArgoCD StatefulSet
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: argocd-application-controller
        namespace: argocd
      spec:
        template:
          spec:
            tolerations:
            - key: role
              operator: Equal
              value: infra
              effect: NoSchedule
    kubeconfig: /etc/kubernetes/new_cluster_admin.conf
    merge_type: strategic-merge
  register: argocd_sts_toleration

# The upstream manifest creates the application-controller pod without the
# infra toleration.  The strategic-merge patch above updates the StatefulSet
# template, but the existing Pending pod keeps the old spec.  Deleting it
# lets the StatefulSet controller recreate it with the toleration.
- name: restart application-controller pod to pick up toleration
  kubernetes.core.k8s:
    state: absent
    kind: Pod
    namespace: argocd
    label_selectors:
      - app.kubernetes.io/name=argocd-application-controller
    kubeconfig: /etc/kubernetes/new_cluster_admin.conf
  when: argocd_sts_toleration.changed

# Workaround for https://github.com/argoproj/argo-cd/issues/26595
# The copyutil init container uses `ln -s` (no force flag) and `cp --update=none`,
# so any container restart within the same pod fails with "File exists".
# Fixed upstream in v3.4.0 (PR #26613). Remove this patch after upgrading.
- name: fix repo-server copyutil init container crash on restart
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-repo-server
        namespace: argocd
      spec:
        template:
          spec:
            initContainers:
            - name: copyutil
              args:
              - /bin/cp /usr/local/bin/argocd /var/run/argocd/argocd && /bin/ln -sf /var/run/argocd/argocd /var/run/argocd/argocd-cmp-server
    kubeconfig: /etc/kubernetes/new_cluster_admin.conf
    merge_type: strategic-merge

- name: configure argocd server for TLS termination at ingress
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
        namespace: argocd
      data:
        server.insecure: "true"
    kubeconfig: /etc/kubernetes/new_cluster_admin.conf
  register: argocd_insecure_config

- name: enable Application health check for app-of-apps sync-wave ordering
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
        namespace: argocd
      data:
        resource.customizations.health.argoproj.io_Application: |
          hs = {}
          hs.status = "Progressing"
          hs.message = ""
          if obj.status ~= nil then
            if obj.status.health ~= nil then
              hs.status = obj.status.health.status
              if obj.status.health.message ~= nil then
                hs.message = obj.status.health.message
              end
            end
            -- Block sync-wave progression until at least one sync has
            -- completed.  Without this guard a freshly-created Application
            -- (no managed resources yet) is reported as Healthy, causing
            -- ArgoCD to advance to the next wave before child apps exist.
            if obj.status.operationState == nil then
              hs.status = "Progressing"
              hs.message = "Waiting for first sync"
            elseif obj.status.operationState.phase == "Running" then
              hs.status = "Progressing"
              hs.message = "Sync operation running"
            end
          end
          return hs
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    kubeconfig: /etc/kubernetes/new_cluster_admin.conf
  register: argocd_cm_health_check
  changed_when: argocd_cm_health_check.method == 'create'
  when: lookup('env', 'ENABLE_SVELTOS') != 'true'

- name: restart argocd-server to apply insecure mode
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-server
        namespace: argocd
      spec:
        template:
          metadata:
            annotations:
              config-patch/restartedAt: "{{ ansible_date_time.iso8601 }}"
    kubeconfig: /etc/kubernetes/new_cluster_admin.conf
  when: argocd_insecure_config.changed

- name: remove legacy argocd ingresses
  kubernetes.core.k8s:
    state: absent
    kind: Ingress
    name: "{{ item }}"
    namespace: argocd
    api_version: networking.k8s.io/v1
    kubeconfig: /etc/kubernetes/new_cluster_admin.conf
  loop:
    - argocd-server-http
    - argocd-server-https
  ignore_errors: true

- name: create argocd Ingress with TLS termination
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: argocd-server
        namespace: argocd
        annotations:
          cert-manager.io/cluster-issuer: homelab-ca-issuer
          ingress.cilium.io/force-https: "enabled"
      spec:
        ingressClassName: cilium
        tls:
        - hosts:
          - argocd.k8s.local
          secretName: argocd-tls
        rules:
        - host: argocd.k8s.local
          http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: argocd-server
                  port:
                    number: 80
    kubeconfig: /etc/kubernetes/new_cluster_admin.conf

- name: check if argocd ssh public key configmap exists
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    name: argocd-ssh-public-key
    namespace: argocd
    kubeconfig: /etc/kubernetes/new_cluster_admin.conf
  register: public_key_configmap
  ignore_errors: true

- name: read existing public key from configmap
  ansible.builtin.set_fact:
    argocd_public_key_content: "{{ public_key_configmap.resources[0].data.publicKey | trim }}"
  when: public_key_configmap.resources | default([]) | length > 0

- name: manage ssh keys for repository access
  ansible.builtin.include_tasks: manage_ssh_keys.yaml
  when: 
    - public_key_configmap.resources | default([]) | length == 0

- name: extract repository host and project path from repository url
  ansible.builtin.set_fact:
    repository_host: "{{ REPOSITORY_SSH_URL | regex_search('git@([^:/]+)', '\\1') | first }}"
    repository_project_path: "{{ REPOSITORY_SSH_URL | regex_search('git@[^:/]+[:/](.+?)(\\.git)?$', '\\1') | first }}"
    repository_project_path_encoded: "{{ (REPOSITORY_SSH_URL | regex_search('git@[^:/]+[:/](.+?)(\\.git)?$', '\\1') | first) | replace('/', '%2F') }}"
  when: 
    - REPOSITORY_SSH_URL is match('^git@')

- name: check if deploy key already exists in repository
  ansible.builtin.uri:
    url: "https://{{ repository_host }}/api/v4/projects/{{ repository_project_path_encoded }}/deploy_keys"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ REPOSITORY_TOKEN }}"
    status_code: [200]
    validate_certs: true
  register: existing_deploy_keys
  when: 
    - "'gitlab' in repository_host"
  ignore_errors: true

- name: check if our key is already registered
  ansible.builtin.set_fact:
    deploy_key_already_registered: >-
      {{
        existing_deploy_keys.json | 
        selectattr('key', 'search', (argocd_public_key_content)) | 
        list | 
        length > 0
      }}
  when:
    - existing_deploy_keys is not skipped
    - existing_deploy_keys is succeeded
    - existing_deploy_keys.json is iterable
    - existing_deploy_keys.json is not string

- name: register deploy key with repository
  ansible.builtin.uri:
    url: "https://{{ repository_host }}/api/v4/projects/{{ repository_project_path_encoded }}/deploy_keys"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ REPOSITORY_TOKEN }}"
      Content-Type: "application/json"
    body_format: json
    body:
      title: "ArgoCD Deploy Key - {{ ansible_date_time.iso8601 }}"
      key: "{{ argocd_public_key_content | trim }}"
      can_push: false
    status_code: [201, 400]
    validate_certs: true
  register: deploy_key_result
  when: 
    - "'gitlab' in repository_host"
    - not (deploy_key_already_registered | default(false))

- name: create argocd homelab project
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: AppProject
      metadata:
        name: homelab
        namespace: argocd
      spec:
        description: Homelab applications and services
        sourceRepos:
          - '*'
        destinations:
          - namespace: '*'
            server: https://kubernetes.default.svc
        clusterResourceWhitelist:
          - group: '*'
            kind: '*'
        namespaceResourceWhitelist:
          - group: '*'
            kind: '*'
    kubeconfig: /etc/kubernetes/new_cluster_admin.conf


