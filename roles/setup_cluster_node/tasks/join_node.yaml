- name: Extract kubeadm join command
  ansible.builtin.shell: |
    kubeadm token create --print-join-command
  register: kubeadm_join_output
  delegate_to: k8s-control-1
  become: true
  no_log: true
  changed_when: false

- name: Run join command if not already in cluster
  ansible.builtin.command:
    cmd: "{{ kubeadm_join_output.stdout }} --ignore-preflight-errors=NumCPU"
    creates:  /etc/kubernetes/kubelet.conf
  become: true
  no_log: true

- name: Wait for node to be ready
  ansible.builtin.command:
    cmd: "kubectl get node {{ inventory_hostname }}"
  register: node_check
  delegate_to: localhost
  become: false
  retries: 30
  delay: 5
  until: node_check.rc == 0
  changed_when: false

- name: Get current node labels
  ansible.builtin.command:
    cmd: "kubectl get node {{ inventory_hostname }} -o jsonpath='{.metadata.labels}'"
  register: current_labels_json
  delegate_to: localhost
  become: false
  changed_when: false

- name: Parse current labels
  ansible.builtin.set_fact:
    current_labels: "{{ current_labels_json.stdout | from_json }}"

- name: Identify user-managed label keys (exclude all Kubernetes-reserved namespaces)
  ansible.builtin.set_fact:
    user_managed_current_labels: >-
      {{
        current_labels.keys() |
        reject('contains', 'kubernetes.io') |
        reject('contains', 'k8s.io') |
        reject('contains', 'nvidia.com') |
        reject('equalto', 'accelerator') |
        reject('equalto', 'gpu-type') |
        list
      }}

- name: Identify labels to remove (user-managed labels not in desired state)
  ansible.builtin.set_fact:
    labels_to_remove: >-
      {{
        user_managed_current_labels |
        reject('in', node_labels.keys() | default([])) |
        list
      }}

- name: Remove obsolete labels
  ansible.builtin.command:
    cmd: "kubectl label node {{ inventory_hostname }} {{ item }}-"
  loop: "{{ labels_to_remove }}"
  delegate_to: localhost
  become: false
  when: labels_to_remove | length > 0

- name: Apply labels to node (only if missing or different)
  ansible.builtin.command:
    cmd: "kubectl label node {{ inventory_hostname }} {{ item.key }}={{ item.value }} --overwrite"
  loop: "{{ node_labels | dict2items }}"
  delegate_to: localhost
  become: false
  when: 
    - node_labels | length > 0
    - (item.key not in current_labels) or (current_labels[item.key] | default('') != item.value)

# ── Taint management ──────────────────────────────────────────────
- name: Get current node taints
  ansible.builtin.command:
    cmd: "kubectl get node {{ inventory_hostname }} -o jsonpath='{.spec.taints}'"
  register: current_taints_json
  delegate_to: localhost
  become: false
  changed_when: false

- name: Parse current taints
  ansible.builtin.set_fact:
    current_taints: "{{ current_taints_json.stdout | default('[]') | from_json | default([]) }}"

- name: Build desired taint keys list
  ansible.builtin.set_fact:
    desired_taint_keys: "{{ node_taints | default([]) | map(attribute='key') | list }}"

- name: Identify user-managed taints to remove (not in desired state, exclude system taints)
  ansible.builtin.set_fact:
    taints_to_remove: >-
      {%- set remove = [] -%}
      {%- for taint in current_taints -%}
        {%- if taint.key not in desired_taint_keys
            and 'kubernetes.io' not in taint.key
            and 'k8s.io' not in taint.key
            and 'nvidia.com' not in taint.key -%}
          {%- set _ = remove.append(taint.key) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ remove }}

- name: Remove obsolete taints
  ansible.builtin.command:
    cmd: "kubectl taint nodes {{ inventory_hostname }} {{ item }}-"
  loop: "{{ taints_to_remove }}"
  delegate_to: localhost
  become: false
  when: taints_to_remove | length > 0
  failed_when: false

- name: Apply desired taints
  ansible.builtin.command:
    cmd: "kubectl taint nodes {{ inventory_hostname }} {{ item.key }}={{ item.value }}:{{ item.effect }} --overwrite"
  loop: "{{ node_taints | default([]) }}"
  delegate_to: localhost
  become: false
  when: node_taints | default([]) | length > 0