apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
  labels:
    category: infrastructure
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: homelab
  sources:
    - repoURL: https://helm.goharbor.io
      chart: harbor
      targetRevision: 1.16.2
      helm:
        releaseName: harbor
        valuesObject:
          expose:
            type: ingress
            tls:
              enabled: true
              certSource: secret
              secret:
                secretName: harbor-tls
            ingress:
              hosts:
                core: harbor.k8s.local
              className: cilium
              annotations:
                cert-manager.io/cluster-issuer: homelab-ca-issuer
                ingress.cilium.io/force-https: "enabled"
          externalURL: https://harbor.k8s.local
          # Admin password is auto-generated by Ansible (bootstrap_harbor_secret role)
          # and stored in a K8s Secret. Nobody needs to know this password —
          # all human access goes through Keycloak OIDC.
          existingSecretAdminPassword: harbor-admin-password
          existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
          persistence:
            enabled: true
            persistentVolumeClaim:
              registry:
                storageClass: rook-ceph-block
                size: 50Gi
              database:
                storageClass: rook-ceph-block
                size: 5Gi
              redis:
                storageClass: rook-ceph-block
                size: 1Gi
              jobservice:
                jobLog:
                  storageClass: rook-ceph-block
                  size: 1Gi
              trivy:
                storageClass: rook-ceph-block
                size: 5Gi
          database:
            type: internal
          redis:
            type: internal
          trivy:
            enabled: true
          # Internal TLS between components disabled — single-replica homelab setup.
          # ingress handles external TLS termination via cert-manager.
          internalTLS:
            enabled: false
          # Metrics for OTel/Prometheus scraping
          metrics:
            enabled: true
            serviceMonitor:
              enabled: false
          # Pre-configure OIDC authentication at deploy time via CONFIG_OVERWRITE_JSON.
          # This makes Keycloak the auth provider from first boot — no admin login
          # needed to switch auth mode. The local admin account still exists for
          # headless API calls (proxy cache project creation) but is never used
          # for human login.
          # Mount homelab CA into all Harbor components (core, jobservice,
          # registry, trivy) so they trust *.k8s.local certificates.
          # The Secret is created by trust-manager via the harbor-ca-bundle Bundle.
          caBundleSecretName: harbor-ca-bundle
          core:
            extraEnvVars:
              - name: CONFIG_OVERWRITE_JSON
                value: '{"auth_mode":"oidc_auth","primary_auth_mode":true,"oidc_name":"Keycloak","oidc_endpoint":"https://keycloak.k8s.local/realms/homelab","oidc_client_id":"harbor","oidc_client_secret":"harbor-keycloak-secret","oidc_scope":"openid,profile,email,roles","oidc_groups_claim":"roles","oidc_admin_group":"cluster-admins","oidc_verify_cert":true,"oidc_auto_onboard":true,"oidc_user_claim":"preferred_username"}'
    - repoURL: "git@gitlab.com:dsynapalos/cluster-setup.git"
      targetRevision: main
      path: argocd_applications/infrastructure/harbor
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
